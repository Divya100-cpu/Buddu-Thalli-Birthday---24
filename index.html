<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Finally... The Wait Is Over</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    #351044 0%,
                    #1d0826 45%,
                    #09030d 100%
                );

            color: #ffffff;

            font-family:
                Georgia,
                "Times New Roman",
                serif;
        }


        /* =========================================
           MAIN SCREEN
        ========================================= */

        .screen {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100dvh;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;

            padding: 20px;

            transition:
                opacity 0.9s ease,
                transform 0.9s ease;
        }


        .screen.hidden {
            opacity: 0;

            pointer-events: none;

            transform: scale(1.05);
        }


        /* =========================================
           BACKGROUND GLOW
        ========================================= */

        .background-glow {
            position: absolute;

            width: 45vw;
            height: 45vw;

            max-width: 600px;
            max-height: 600px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(210, 80, 255, 0.16),
                    transparent 70%
                );

            filter: blur(20px);

            pointer-events: none;
        }


        /* =========================================
           STARS
        ========================================= */

        .stars {
            position: absolute;

            inset: 0;

            pointer-events: none;
        }


        .star {
            position: absolute;

            width: 2px;
            height: 2px;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.7);

            animation:
                twinkle 3s ease-in-out infinite;
        }


        .star:nth-child(1) {
            left: 8%;
            top: 20%;
        }

        .star:nth-child(2) {
            left: 18%;
            top: 65%;

            animation-delay: 1s;
        }

        .star:nth-child(3) {
            left: 30%;
            top: 35%;

            animation-delay: 2s;
        }

        .star:nth-child(4) {
            left: 45%;
            top: 15%;

            animation-delay: 0.5s;
        }

        .star:nth-child(5) {
            left: 63%;
            top: 27%;

            animation-delay: 1.5s;
        }

        .star:nth-child(6) {
            left: 77%;
            top: 62%;

            animation-delay: 2.5s;
        }

        .star:nth-child(7) {
            left: 90%;
            top: 25%;

            animation-delay: 1s;
        }

        .star:nth-child(8) {
            left: 73%;
            top: 82%;

            animation-delay: 2s;
        }

        .star:nth-child(9) {
            left: 42%;
            top: 78%;

            animation-delay: 0.8s;
        }

        .star:nth-child(10) {
            left: 94%;
            top: 53%;

            animation-delay: 1.8s;
        }


        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.2;

                transform:
                    scale(0.8);
            }

            50% {
                opacity: 1;

                transform:
                    scale(1.5);
            }
        }


        /* =========================================
           CONTENT
        ========================================= */

        .content {
            position: relative;

            z-index: 5;

            width:
                min(900px, 100%);

            display: flex;

            flex-direction: column;

            align-items: center;

            text-align: center;
        }


        /* =========================================
           TOP SMALL TEXT
        ========================================= */

        .eyebrow {

            font-size:
                clamp(12px, 1.3vw, 17px);

            letter-spacing:
                clamp(3px, 0.5vw, 6px);

            text-transform: uppercase;

            color:
                rgba(255, 255, 255, 0.65);

            margin-bottom:
                clamp(14px, 2vh, 22px);

            opacity: 0;

            animation:
                fadeUp 1s ease forwards;

            animation-delay: 0.3s;
        }


        /* =========================================
           MAIN TITLE
        ========================================= */

        h1 {

            font-size:
                clamp(42px, 6.5vw, 88px);

            line-height: 0.95;

            font-weight: 500;

            letter-spacing:
                clamp(1px, 0.2vw, 4px);

            text-transform: uppercase;

            margin-bottom:
                clamp(18px, 2.5vh, 25px);

            text-shadow:
                0 0 15px
                rgba(255, 150, 220, 0.25),

                0 0 45px
                rgba(220, 90, 255, 0.15);

            opacity: 0;

            animation:
                titleReveal 1.3s ease forwards;

            animation-delay: 0.8s;
        }


        /* =========================================
           DESCRIPTION
        ========================================= */

        .description {

            width:
                min(620px, 100%);

            font-size:
                clamp(15px, 1.5vw, 20px);

            line-height: 1.55;

            color:
                rgba(255, 255, 255, 0.72);

            margin-bottom:
                clamp(18px, 2.5vh, 25px);

            opacity: 0;

            animation:
                fadeUp 1s ease forwards;

            animation-delay: 1.8s;
        }


        /* =========================================
           QUESTION
        ========================================= */

        .question {

            font-size:
                clamp(18px, 2.1vw, 28px);

            line-height: 1.35;

            max-width: 650px;

            margin-bottom: 28px;

            color: #ffffff;

            text-shadow:
                0 0 18px
                rgba(255, 100, 200, 0.3);

            opacity: 0;

            animation:
                fadeUp 1s ease forwards;

            animation-delay: 2.5s;
        }


        /* =========================================
           READY BUTTON
        ========================================= */

        .ready-button {

            position: fixed;

            left: 50%;

            top: 78%;

            transform:
                translate(-50%, -50%);

            min-width: 175px;

            padding:
                15px 35px;

            border-radius: 50px;

            border:
                1px solid
                rgba(255, 255, 255, 0.4);

            background:
                linear-gradient(
                    135deg,
                    #e15aaa,
                    #ad4be4
                );

            color: white;

            font-family: inherit;

            font-size: 16px;

            letter-spacing: 1.5px;

            cursor: pointer;

            z-index: 100;

            box-shadow:
                0 8px 30px
                rgba(230, 70, 180, 0.35);

            transition:
                left 0.45s ease,
                top 0.45s ease,
                box-shadow 0.25s ease;
        }


        .ready-button:hover {

            box-shadow:
                0 12px 45px
                rgba(230, 70, 180, 0.6);
        }


        /* =========================================
           SECOND SCREEN
        ========================================= */

        .screen-two-content {

            max-width: 750px;
        }


        .screen-two-content h2 {

            font-size:
                clamp(38px, 6vw, 75px);

            line-height: 1;

            font-weight: 500;

            margin-bottom: 25px;
        }


        .screen-two-content p {

            font-size:
                clamp(16px, 2vw, 22px);

            line-height: 1.7;

            color:
                rgba(255, 255, 255, 0.72);
        }


        /* =========================================
           ANIMATIONS
        ========================================= */

        @keyframes fadeUp {

            from {

                opacity: 0;

                transform:
                    translateY(22px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        @keyframes titleReveal {

            from {

                opacity: 0;

                transform:
                    scale(0.9);

                filter:
                    blur(10px);
            }

            to {

                opacity: 1;

                transform:
                    scale(1);

                filter:
                    blur(0);
            }
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .screen {

                padding: 18px;
            }


            .description {

                max-width: 340px;
            }


            .question {

                max-width: 340px;
            }


            .ready-button {

                min-width: 160px;

                padding:
                    14px 28px;

                font-size: 14px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================================
         FIRST SCREEN
    ========================================= -->

    <section
        class="screen"
        id="screen1"
    >


        <div
            class="background-glow"
        ></div>


        <div class="stars">

            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>

        </div>


        <div class="content">


            <!-- EXACT TEXT YOU ASKED FOR -->

            <div class="eyebrow">

                30 DAYS • 30 WISHES

            </div>


            <h1>

                FINALLY...

                <br>

                THE WAIT IS OVER.

            </h1>


            <p class="description">

                Thirty days of wishes brought us all the way here...
                and now there's only one thing left to ask.

            </p>


            <p class="question">

                Are you ready to see

                <br>

                what surprise I planned for you? 👀❤️

            </p>


        </div>


        <!-- READY BUTTON -->

        <button
            id="readyButton"
            class="ready-button"
            type="button"
        >

            I'M READY ✨

        </button>


    </section>



    <!-- =========================================
         SECOND SCREEN
    ========================================= -->

    <section
        class="screen hidden"
        id="screen2"
    >

        <div
            class="content screen-two-content"
        >

            <h2>

                Oh...

                <br>

                You Actually Made It. 👀

            </h2>


            <p>

                And this is only the beginning...

            </p>

        </div>

    </section>



    <script>


        /* =========================================
           ELEMENTS
        ========================================= */

        const button =
            document.getElementById(
                "readyButton"
            );


        const screen1 =
            document.getElementById(
                "screen1"
            );


        const screen2 =
            document.getElementById(
                "screen2"
            );



        /* =========================================
           BUTTON STATES

           0 = ORIGINAL

           1 = TOP CENTER

           2 = DOWN

           3 = TOP RIGHT

           4 = ORIGINAL / FINAL CLICK

           5 = NEXT SCREEN
        ========================================= */

        let state = 0;


        let pointerX = null;

        let pointerY = null;

        let moving = false;



        /* =========================================
           POSITIONS
        ========================================= */

        const originalPosition = {

            left: "50vw",

            top: "78vh"

        };


        const topCenterPosition = {

            left: "50vw",

            top: "7vh"

        };


        const topRightPosition = {

            left: "88vw",

            top: "7vh"

        };



        /* =========================================
           BUTTON CENTER
        ========================================= */

        function getButtonCenter() {

            const rect =
                button.getBoundingClientRect();


            return {

                x:
                    rect.left +
                    rect.width / 2,

                y:
                    rect.top +
                    rect.height / 2

            };

        }



        /* =========================================
           CHECK DISTANCE
        ========================================= */

        function checkDistance() {


            /*
             * Do nothing while button
             * is moving.
             */

            if (
                moving ||
                pointerX === null ||
                pointerY === null
            ) {

                return;

            }


            /*
             * FINAL STATE
             *
             * Button is back at original
             * position and is waiting for
             * an actual click.
             */

            if (state === 4) {

                return;

            }


            /*
             * Only these states can
             * respond to proximity.
             */

            if (
                state !== 0 &&
                state !== 1 &&
                state !== 2 &&
                state !== 3
            ) {

                return;

            }


            const center =
                getButtonCenter();


            const dx =
                center.x -
                pointerX;


            const dy =
                center.y -
                pointerY;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            /*
             * Detection distance.
             */

            if (
                distance < 180
            ) {

                moveButton();

            }

        }



        /* =========================================
           MOVE BUTTON
        ========================================= */

        function moveButton() {


            moving = true;


            /*
             * -------------------------------------
             *
             * STEP 1
             *
             * ORIGINAL → TOP CENTER
             *
             * -------------------------------------
             */

            if (state === 0) {

                state = 1;


                button.style.left =
                    topCenterPosition.left;


                button.style.top =
                    topCenterPosition.top;

            }


            /*
             * -------------------------------------
             *
             * STEP 2
             *
             * TOP CENTER → DOWN
             *
             * -------------------------------------
             */

            else if (state === 1) {

                state = 2;


                button.style.left =
                    originalPosition.left;


                button.style.top =
                    originalPosition.top;

            }


            /*
             * -------------------------------------
             *
             * STEP 3
             *
             * DOWN → TOP RIGHT
             *
             * -------------------------------------
             */

            else if (state === 2) {

                state = 3;


                button.style.left =
                    topRightPosition.left;


                button.style.top =
                    topRightPosition.top;

            }


            /*
             * -------------------------------------
             *
             * STEP 4
             *
             * TOP RIGHT → ORIGINAL
             *
             * -------------------------------------
             */

            else if (state === 3) {

                state = 4;


                button.style.left =
                    originalPosition.left;


                button.style.top =
                    originalPosition.top;

            }


            /*
             * Wait until movement finishes.
             */

            setTimeout(
                function() {

                    moving = false;

                },

                500
            );

        }



        /* =========================================
           DESKTOP MOUSE
        ========================================= */

        document.addEventListener(
            "mousemove",

            function(event) {


                pointerX =
                    event.clientX;


                pointerY =
                    event.clientY;


                checkDistance();

            }
        );



        /* =========================================
           MOBILE TOUCH
        ========================================= */

        document.addEventListener(
            "touchstart",

            function(event) {


                if (
                    !event.touches ||
                    event.touches.length === 0
                ) {

                    return;

                }


                pointerX =
                    event.touches[0].clientX;


                pointerY =
                    event.touches[0].clientY;


                checkDistance();

            },

            {
                passive: true
            }
        );


        document.addEventListener(
            "touchmove",

            function(event) {


                if (
                    !event.touches ||
                    event.touches.length === 0
                ) {

                    return;

                }


                pointerX =
                    event.touches[0].clientX;


                pointerY =
                    event.touches[0].clientY;


                checkDistance();

            },

            {
                passive: true
            }
        );



        /* =========================================
           BUTTON CLICK
        ========================================= */

        button.addEventListener(
            "click",

            function(event) {


                event.preventDefault();


                /*
                 * -------------------------------------
                 *
                 * ONLY FINAL CLICK
                 *
                 * ORIGINAL → NEXT SCREEN
                 *
                 * -------------------------------------
                 */

                if (state === 4) {

                    state = 5;


                    screen1.classList.add(
                        "hidden"
                    );


                    setTimeout(
                        function() {

                            screen2.classList.remove(
                                "hidden"
                            );

                        },

                        300
                    );

                }

            }
        );



        /* =========================================
           INITIAL POSITION
        ========================================= */

        window.addEventListener(
            "load",

            function() {

                button.style.left =
                    originalPosition.left;


                button.style.top =
                    originalPosition.top;

            }
        );



        /* =========================================
           RESIZE
        ========================================= */

        window.addEventListener(
            "resize",

            function() {


                if (state === 0) {

                    button.style.left =
                        originalPosition.left;

                    button.style.top =
                        originalPosition.top;

                }


                if (state === 1) {

                    button.style.left =
                        topCenterPosition.left;

                    button.style.top =
                        topCenterPosition.top;

                }


                if (state === 2) {

                    button.style.left =
                        originalPosition.left;

                    button.style.top =
                        originalPosition.top;

                }


                if (state === 3) {

                    button.style.left =
                        topRightPosition.left;

                    button.style.top =
                        topRightPosition.top;

                }


                if (state === 4) {

                    button.style.left =
                        originalPosition.left;

                    button.style.top =
                        originalPosition.top;

                }

            }
        );


    </script>

</body>
</html>
