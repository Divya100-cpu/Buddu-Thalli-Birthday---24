<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Something</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Georgia,"Times New Roman",serif;
    background:#100014;
    color:#fff;
}

body{
    position:relative;
}

body::before{
    content:"";
    position:fixed;
    inset:-20%;
    background:
        radial-gradient(circle at 50% 42%,rgba(170,45,210,.22),transparent 28%),
        radial-gradient(circle at 50% 80%,rgba(110,25,145,.13),transparent 35%);
    animation:bgPulse 7s ease-in-out infinite alternate;
    pointer-events:none;
}

@keyframes bgPulse{
    from{transform:scale(1)}
    to{transform:scale(1.08)}
}

.screen{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    opacity:0;
}

.screen.active{
    display:flex;
    animation:screenIn .8s ease forwards;
}

@keyframes screenIn{
    from{
        opacity:0;
        transform:scale(.97);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

/* --------------------------------
   INTRO
-------------------------------- */

#intro{
    text-align:center;
}

.small-title{
    font-size:10px;
    letter-spacing:7px;
    text-transform:uppercase;
    opacity:.72;
    margin-bottom:18px;
}

.main-title{
    font-size:clamp(42px,6vw,76px);
    font-weight:bold;
    text-shadow:
        0 0 8px #fff,
        0 0 20px rgba(255,160,255,.8),
        0 0 40px rgba(210,80,240,.5);
}

.subtitle{
    margin-top:14px;
    font-size:14px;
    opacity:.7;
    letter-spacing:2px;
}

.start-btn,
.next-btn,
.close-btn{
    margin-top:32px;
    padding:13px 28px;
    border-radius:30px;
    border:1px solid rgba(255,255,255,.5);
    color:white;
    background:linear-gradient(135deg,#d94cc5,#9548dc);
    box-shadow:0 0 20px rgba(210,70,230,.4);
    cursor:pointer;
    font-family:Georgia,serif;
    font-size:12px;
    letter-spacing:2px;
    transition:.25s;
}

.start-btn:hover,
.next-btn:hover,
.close-btn:hover{
    transform:scale(1.06);
    box-shadow:0 0 30px rgba(230,100,255,.65);
}

/* --------------------------------
   GIFTS
-------------------------------- */

#giftScreen{
    padding:25px;
}

.gift-heading{
    text-align:center;
    margin-bottom:30px;
}

.gift-heading .small-title{
    margin-bottom:10px;
}

.gift-heading h1{
    font-size:clamp(40px,5.5vw,68px);
    text-shadow:
        0 0 8px white,
        0 0 20px rgba(255,160,255,.8),
        0 0 38px rgba(220,70,240,.45);
}

.gift-grid{
    width:min(650px,92vw);
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:12px;
}

.gift{
    position:relative;
    aspect-ratio:1/1;
    border:1px solid rgba(255,220,255,.45);
    border-radius:12px;
    background:
        linear-gradient(90deg,transparent 42%,rgba(255,110,230,.35) 43%,rgba(255,110,230,.55) 50%,rgba(255,110,230,.35) 57%,transparent 58%),
        linear-gradient(0deg,transparent 42%,rgba(255,110,230,.35) 43%,rgba(255,110,230,.55) 50%,rgba(255,110,230,.35) 57%,transparent 58%),
        linear-gradient(145deg,#321238,#52205a);
    box-shadow:
        inset 0 0 20px rgba(230,80,255,.12),
        0 0 12px rgba(210,60,230,.12);
    cursor:pointer;
    overflow:hidden;
    transition:.3s;
}

.gift::before{
    content:"";
    position:absolute;
    width:18px;
    height:18px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border:2px solid rgba(255,180,255,.8);
    border-radius:50%;
    box-shadow:0 0 14px rgba(255,120,245,.8);
}

.gift::after{
    content:"";
    position:absolute;
    left:50%;
    top:0;
    width:2px;
    height:100%;
    transform:translateX(-50%);
    background:rgba(255,125,235,.45);
}

.gift:hover{
    transform:translateY(-4px) scale(1.03);
    box-shadow:
        0 0 18px rgba(240,80,255,.4),
        inset 0 0 25px rgba(240,80,255,.15);
}

.gift.opened{
    animation:giftOpen .55s ease;
}

@keyframes giftOpen{
    0%{transform:scale(1)}
    50%{transform:scale(1.12)}
    100%{transform:scale(1)}
}

/* --------------------------------
   POPUP
-------------------------------- */

.popup{
    position:fixed;
    inset:0;
    background:rgba(8,0,12,.58);
    backdrop-filter:blur(5px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:20;
}

.popup.show{
    display:flex;
    animation:fadeIn .35s ease;
}

@keyframes fadeIn{
    from{opacity:0}
    to{opacity:1}
}

.popup-card{
    width:min(420px,86vw);
    padding:38px 28px;
    text-align:center;
    border-radius:18px;
    border:1px solid rgba(255,210,255,.35);
    background:
        linear-gradient(145deg,rgba(66,24,75,.96),rgba(35,10,42,.97));
    box-shadow:
        0 0 35px rgba(210,70,240,.3),
        inset 0 0 25px rgba(255,100,240,.06);
    animation:popupIn .45s cubic-bezier(.2,.8,.2,1);
}

@keyframes popupIn{
    from{
        opacity:0;
        transform:scale(.75) translateY(20px);
    }
    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

.popup-card h2{
    font-size:25px;
    line-height:1.45;
    font-weight:normal;
    text-shadow:0 0 10px rgba(255,200,255,.6);
}

.popup-card .close-btn{
    margin-top:25px;
}

/* --------------------------------
   INVITATION
-------------------------------- */

#invitation{
    padding:25px;
}

.invitation-card{
    width:min(500px,88vw);
    min-height:580px;
    padding:45px 35px;
    text-align:center;
    border-radius:22px;
    border:1px solid rgba(255,210,255,.4);
    background:
        linear-gradient(145deg,rgba(70,27,78,.95),rgba(35,9,43,.98));
    box-shadow:
        0 0 45px rgba(210,70,240,.25),
        inset 0 0 35px rgba(255,120,240,.05);
    animation:letterIn 1s ease;
}

@keyframes letterIn{
    from{
        opacity:0;
        transform:translateY(40px) scale(.9);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.invitation-small{
    font-size:10px;
    letter-spacing:6px;
    opacity:.65;
    margin-bottom:25px;
}

.invitation-card h1{
    font-size:clamp(40px,6vw,65px);
    line-height:1;
    text-shadow:
        0 0 8px white,
        0 0 20px rgba(255,160,255,.8);
}

.date{
    margin-top:28px;
    font-size:28px;
    font-weight:bold;
    letter-spacing:2px;
}

.time{
    margin-top:8px;
    font-size:15px;
    letter-spacing:5px;
    opacity:.8;
}

.divider{
    width:70px;
    height:1px;
    background:rgba(255,200,255,.6);
    margin:28px auto;
}

.invitation-line{
    font-size:17px;
    line-height:1.8;
    letter-spacing:1px;
}

.secret{
    margin-top:22px;
    font-size:10px;
    letter-spacing:4px;
    opacity:.55;
    text-transform:uppercase;
}

.final-btn{
    margin-top:30px;
    padding:13px 28px;
    border:1px solid rgba(255,255,255,.45);
    border-radius:30px;
    background:linear-gradient(135deg,#d94cc5,#9548dc);
    color:white;
    cursor:pointer;
    font-family:Georgia,serif;
    letter-spacing:2px;
}

/* --------------------------------
   RESPONSIVE
-------------------------------- */

@media(max-width:700px){

    .gift-grid{
        gap:7px;
        width:95vw;
    }

    .gift{
        border-radius:8px;
    }

    .gift-heading{
        margin-bottom:18px;
    }

    .gift-heading h1{
        font-size:40px;
    }

    .popup-card{
        padding:30px 20px;
    }

    .invitation-card{
        min-height:auto;
        padding:35px 25px;
    }
}

@media(max-width:430px){

    .gift-grid{
        grid-template-columns:repeat(4,1fr);
        width:90vw;
        gap:8px;
    }

    .gift-heading h1{
        font-size:35px;
    }

    .gift-heading .small-title{
        font-size:8px;
        letter-spacing:4px;
    }
}
</style>
</head>

<body>

<!-- AUDIO -->
<audio id="birthdaySong" preload="auto">
    <source src="Hey Rangule - NaaSongsHD.mp3" type="audio/mpeg">
</audio>


<!-- INTRO -->
<section id="intro" class="screen active">

    <div class="small-title">something is waiting</div>

    <h1 class="main-title">
        OPEN CAREFULLY.
    </h1>

    <div class="subtitle">
        🎁
    </div>

    <button class="start-btn" onclick="startExperience()">
        OPEN
    </button>

</section>


<!-- 24 GIFTS -->
<section id="giftScreen" class="screen">

    <div class="gift-heading">

        <div class="small-title">
            something is waiting
        </div>

        <h1>OPEN CAREFULLY.</h1>

    </div>

    <div class="gift-grid" id="giftGrid"></div>

</section>


<!-- HINT POPUP -->
<div class="popup" id="popup">

    <div class="popup-card">

        <h2 id="hintText">
            Something you'll understand<br>
            the moment you see it. 👀
        </h2>

        <button class="close-btn" onclick="closePopup()">
            CLOSE
        </button>

    </div>

</div>


<!-- INVITATION -->
<section id="invitation" class="screen">

    <div class="invitation-card">

        <div class="invitation-small">
            A LITTLE SOMETHING
        </div>

        <h1>
            SAVE<br>
            THE DATE
        </h1>

        <div class="date">
            30 OCTOBER
        </div>

        <div class="time">
            10:00 PM
        </div>

        <div class="divider"></div>

        <div class="invitation-line">
            ONE EVENING.<br>
            ONE PLAN.<br>
            ONE PLACE.
        </div>

        <div class="secret">
            private theatre · location sealed
        </div>

        <button class="final-btn" onclick="finishExperience()">
            I'M IN ❤️
        </button>

    </div>

</section>


<script>

/* --------------------------------
   AUDIO
-------------------------------- */

const song = document.getElementById("birthdaySong");

/*
   The song starts from 0:00.
   It keeps playing while the gifts are opened
   and while the invitation appears.

   When the invitation is finished, the audio stops.
*/

let audioStarted = false;


/* --------------------------------
   24 GIFTS
-------------------------------- */

const giftGrid = document.getElementById("giftGrid");
const popup = document.getElementById("popup");
const hintText = document.getElementById("hintText");

const hints = [

    "Something you'll probably wear more than once. 👀",

    "A little change to your usual look.",

    "Something made for a very specific place. ✨",

    "Something that belongs where you pray.",

    "A little something with a fragrance attached.",

    "Something you'll reach for before stepping out.",

    "For the days when the sun has opinions. 😌",

    "Something that quietly completes the look.",

    "Small. Useful. Probably going everywhere with you.",

    "Something you'll carry more often than you realize.",

    "Something with a meaning only you'll fully understand. 🤍",

    "A tiny companion for your keys.",

    "Something worth keeping around for a long time.",

    "Something that changes the room after dark. ✨",

    "A little protection for everyday life.",

    "Another little layer of protection.",

    "Something sweet is hiding here. 🍫",

    "Because one sweet thing clearly wasn't enough.",

    "This one isn't really meant to stay in a box. 👀",

    "Something that makes a celebration feel complete.",

    "Apparently, one more sweet thing was necessary. 🍫",

    "For your hands when you need a little extra comfort.",

    "For a different kind of ride. 🏍️",

    "The biggest surprise is never the easiest one to wrap. 👀"

];


for(let i = 0; i < 24; i++){

    const box = document.createElement("div");

    box.className = "gift";

    box.dataset.index = i;

    box.addEventListener("click", () => openGift(box,i));

    giftGrid.appendChild(box);

}


/* --------------------------------
   START
-------------------------------- */

function startExperience(){

    if(!audioStarted){

        song.currentTime = 0;

        song.play()
            .then(() => {
                audioStarted = true;
            })
            .catch(() => {
                /*
                  Browser may require another tap
                  before allowing audio.
                */
            });

    }

    showScreen("giftScreen");

}


/* --------------------------------
   OPEN GIFT
-------------------------------- */

function openGift(box,index){

    box.classList.remove("opened");

    void box.offsetWidth;

    box.classList.add("opened");

    hintText.innerHTML = hints[index];

    setTimeout(() => {

        popup.classList.add("show");

    },180);

}


/* --------------------------------
   CLOSE POPUP
-------------------------------- */

function closePopup(){

    popup.classList.remove("show");

}


/* --------------------------------
   SCREEN CHANGE
-------------------------------- */

function showScreen(id){

    document.querySelectorAll(".screen").forEach(screen => {

        screen.classList.remove("active");

    });

    document.getElementById(id).classList.add("active");

}


/* --------------------------------
   AFTER ALL GIFTS
-------------------------------- */

let invitationShown = false;


/*
   Double click / tap the final gift after
   all gifts have been explored to reveal
   the invitation.

   The user can open the gifts in any order.
*/

const openedGifts = new Set();

document.querySelectorAll(".gift").forEach((box,index) => {

    box.addEventListener("click",() => {

        openedGifts.add(index);

        if(openedGifts.size === 24){

            setTimeout(() => {

                if(!invitationShown){

                    invitationShown = true;

                    popup.classList.remove("show");

                    showScreen("invitation");

                }

            },700);

        }

    });

});


/* --------------------------------
   FINAL SCREEN
-------------------------------- */

function finishExperience(){

    /*
       Stop the song only after the invitation
       has been viewed and the final button is pressed.
    */

    song.pause();
    song.currentTime = 0;

    document.body.innerHTML = `
        <div style="
            position:fixed;
            inset:0;
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
            background:
              radial-gradient(circle at center,#3d1745,#100014 65%);
            color:white;
            font-family:Georgia,serif;
        ">

            <div>

                <div style="
                    font-size:10px;
                    letter-spacing:6px;
                    opacity:.65;
                    margin-bottom:20px;
                ">
                    ONE LAST LITTLE THING
                </div>

                <div style="
                    font-size:clamp(42px,7vw,80px);
                    font-weight:bold;
                    text-shadow:
                        0 0 8px white,
                        0 0 25px rgba(255,150,255,.8);
                ">
                    ❤️
                </div>

            </div>

        </div>
    `;

}

</script>

</body>
</html>
