<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buddu Thalli Birthday ❤️</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;margin:0}
body{
    overflow:hidden;
    background:radial-gradient(circle at 50% 35%,#42104f 0%,#210725 35%,#100315 65%,#060208 100%);
    color:white;
    font-family:Georgia,"Times New Roman",serif;
}
.screen{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:none;
    align-items:center;
    justify-content:center;
    text-align:center;
    overflow:hidden;
}
.screen.active{display:flex}
.decor{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.balloon{
    position:absolute;
    width:55px;
    height:68px;
    border-radius:50% 50% 45% 45%;
    opacity:.85;
    animation:floatBalloon 6s ease-in-out infinite;
}
.balloon:after{
    content:"";
    position:absolute;
    width:1px;
    height:100px;
    background:rgba(255,255,255,.4);
    top:65px;
    left:50%;
}
.balloon1{left:5%;top:15%;background:#ff5c8a}
.balloon2{left:15%;top:70%;background:#a855f7;animation-delay:1s}
.balloon3{right:7%;top:18%;background:#ec4899;animation-delay:2s}
.balloon4{right:17%;top:72%;background:#8b5cf6;animation-delay:3s}
.balloon5{left:40%;top:8%;background:#f472b6;animation-delay:1.5s}
.balloon6{right:40%;top:82%;background:#c084fc;animation-delay:2.5s}
@keyframes floatBalloon{
    0%,100%{transform:translateY(0) rotate(-3deg)}
    50%{transform:translateY(-18px) rotate(3deg)}
}
.heart{
    position:absolute;
    font-size:26px;
    animation:floatHeart 7s ease-in-out infinite;
    text-shadow:0 0 10px rgba(255,50,100,.6);
}

.heart2{right:12%;
