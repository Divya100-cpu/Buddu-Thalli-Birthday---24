<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finally... The Wait Is Over ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    #351044 0%,
                    #1d0826 42%,
                    #09030d 100%
                );

            color: #ffffff;

            font-family:
                Georgia,
                "Times New Roman",
                serif;
        }

        /* =========================================
           SCREEN
        ========================================= */

        .screen {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100dvh;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;

            padding:
                clamp(18px, 4vw, 45px);

            transition:
                opacity 1s ease,
                transform 1s ease;
        }

        .screen.hidden {
            opacity: 0;

            pointer-events: none;

            transform: scale(1.04);
        }

        /* =========================================
           BACKGROUND
        ========================================= */

        .background-glow {
            position: absolute;

            width: 45vw;
            height: 45vw;

            max-width: 600px;
            max-height: 600px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(206, 77, 255, 0.14),
                    transparent 70%
                );

            filter: blur(20px);

            pointer-events: none;
        }

        .stars {
            position: absolute;

            inset: 0;

            pointer-events: none;
        }

        .star {
            position: absolute;

            width: 2px;
            height: 2px;

            background: rgba(255,255,255,0.65);

            border-radius: 50%;

            animation:
                twinkle 3s ease-in-out infinite;
        }

        .star:nth-child(1) {
            left: 10%;
            top: 22%;
            animation-delay: 0s;
        }

        .star:nth-child(2) {
            left: 20%;
            top: 65%;
            animation-delay: 1s;
        }

        .star:nth-child(3) {
            left: 31%;
            top: 35%;
            animation-delay: 2s;
        }

        .star:nth-child(4) {
            left: 47%;
            top: 15%;
            animation-delay: 0.5s;
        }

        .star:nth-child(5) {
            left: 64%;
            top: 30%;
            animation-delay: 1.5s;
        }

        .star:nth-child(6) {
            left: 77%;
            top: 63%;
            animation-delay: 2.5s;
        }

        .star:nth-child(7) {
            left: 89%;
            top: 27%;
            animation-delay: 1s;
        }

        .star:nth-child(8) {
            left: 73%;
            top: 83%;
            animation-delay: 2s;
        }

        .star:nth-child(9) {
            left: 42%;
            top: 78%;
            animation-delay: 0.8s;
        }

        .star:nth-child(10) {
            left: 93%;
            top: 52%;
            animation-delay: 1.8s;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.2;
                transform: scale(0.8);
            }

            50% {
                opacity: 1;
                transform: scale(1.5);
            }
        }

        /* =========================================
           CONTENT
        ========================================= */

        .content {
            position: relative;

            z-index: 5;

            width: min(900px, 100%);

            display: flex;

            flex-direction: column;

            align-items: center;

            text-align: center;
        }

        .eyebrow {
            font-size:
                clamp(12px, 1.2vw, 17px);

            letter-spacing:
                clamp(3px, 0.5vw, 6px);

            text-transform: uppercase;

            color:
                rgba(255,255,255,0.62);

            margin-bottom:
                clamp(14px, 2vh, 24px);

            opacity: 0;

            animation:
                fadeUp 1s ease forwards;

            animation-delay: 0.3s;
        }

        /* =========================================
           MAIN TITLE
        ========================================= */

        h1 {
            font-size:
                clamp(42px, 6.8vw, 88px);

            line-height:
                0.95;

            font-weight: 500;

            letter-spacing:
                clamp(1px, 0.25vw, 4px);

            text-transform: uppercase;

            margin-bottom:
                clamp(18px, 3vh, 28px);

            text-shadow:
                0 0 15px rgba(255,150,220,0.25),
                0 0 45px rgba(220,90,255,0.15);

            opacity: 0;

            animation:
                titleReveal 1.3s ease forwards;

            animation-delay: 0.8s;
        }

        /* =========================================
           DESCRIPTION
        ========================================= */

        .description {
            width: min(620px, 100%);

            font-size:
                clamp(15px, 1.55vw, 20px);

            line-height:
                1.65;

            color:
                rgba(255,255,255,0.72);

            margin-bottom:
                clamp(18px, 3vh, 28px);

            opacity: 0;

            animation:
                fadeUp 1s ease forwards;

            animation-delay: 1.8s;
        }

        /* =========================================
           QUESTION
        ========================================= */

        .question {
            font-size:
                clamp(18px, 2.2vw, 28px);

            line-height:
                1.4;

            color: #ffffff;

            max-width: 650px;

            margin-bottom:
                clamp(22px, 3vh, 32px);

            text-shadow:
                0 0 18px rgba(255,100,200,0.3);

            opacity: 0;

            animation:
                fadeUp 1s ease forwards;

            animation-delay: 2.5s;
        }

        /* =========================================
           BUTTON AREA
        ========================================= */

        .button-area {
            position: relative;

            width: 100%;

            height:
                clamp(95px, 13vh, 125px);

            opacity: 0;

            animation:
                fadeUp 1s ease forwards;

            animation-delay: 3.1s;
        }

        /* =========================================
           BUTTON
        ========================================= */

        .ready-button {
            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            min-width: 175px;

            padding:
                15px 35px;

            border-radius: 50px;

            border:
                1px solid rgba(255,255,255,0.4);

            background:
                linear-gradient(
                    135deg,
                    #e15aaa,
                    #ad4be4
                );

            color: white;

            font-family: inherit;

            font-size: 16px;

            letter-spacing: 1.5px;

            cursor: pointer;

            box-shadow:
                0 8px 30px rgba(230,70,180,0.35);

            z-index: 20;

            transition:
                left 0.55s cubic-bezier(0.2, 1.4, 0.4, 1),
                top 0.55s cubic-bezier(0.2, 1.4, 0.4, 1),
                transform 0.2s ease,
                box-shadow 0.3s ease;
        }

        .ready-button:hover {
            box-shadow:
                0 12px 45px rgba(230,70,180,0.55);
        }

        .ready-button:active {
            transform:
                translate(-50%, -50%)
                scale(0.94);
        }

        /* =========================================
           SCREEN 2
        ========================================= */

        .screen-two-content {
            max-width: 750px;
        }

        .screen-two-content h2 {
            font-size:
                clamp(38px, 6vw, 75px);

            line-height: 1;

            font-weight: 500;

            margin-bottom: 25px;
        }

        .screen-two-content p {
            font-size:
                clamp(16px, 2vw, 22px);

            line-height: 1.7;

            color:
                rgba(255,255,255,0.72);
        }

        /* =========================================
           ANIMATIONS
        ========================================= */

        @keyframes fadeUp {

            from {
                opacity: 0;

                transform:
                    translateY(22px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }

        @keyframes titleReveal {

            from {
                opacity: 0;

                transform:
                    scale(0.9);

                filter:
                    blur(10px);
            }

            to {
                opacity: 1;

                transform:
                    scale(1);

                filter:
                    blur(0);
            }
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .screen {
                padding: 18px;
            }

            .description {
                max-width: 340px;
            }

            .question {
                max-width: 340px;
            }

            .ready-button {
                min-width: 160px;

                padding:
                    14px 28px;

                font-size: 14px;
            }
        }

        /* =========================================
           SHORT HEIGHT SCREENS
        ========================================= */

        @media (max-height: 700px) {

            .eyebrow {
                margin-bottom: 10px;
            }

            h1 {
                margin-bottom: 14px;
            }

            .description {
                margin-bottom: 14px;
            }

            .question {
                margin-bottom: 14px;
            }

            .button-area {
                height: 80px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================
         SCREEN 1
    ========================================= -->

    <section
        class="screen"
        id="screen1"
    >

        <div class="background-glow"></div>

        <div class="stars">

            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>

        </div>


        <div class="content">

            <div class="eyebrow">
                30 Days • 30 Wishes
            </div>


            <h1>
                Finally...
                <br>
                The Wait Is Over.
            </h1>


            <p class="description">
                Thirty days of wishes brought us all the way here...
                and now there's only one thing left to ask.
            </p>


            <p class="question">
                Are you ready to see
                <br>
                what surprise I planned for you? 👀❤️
            </p>


            <div class="button-area">

                <button
                    id="readyButton"
                    class="ready-button"
                    type="button"
                >
                    I'M READY ✨
                </button>

            </div>

        </div>

    </section>


    <!-- =========================================
         SCREEN 2
    ========================================= -->

    <section
        class="screen hidden"
        id="screen2"
    >

        <div class="content screen-two-content">

            <h2>
                Oh...
                <br>
                You Actually Made It. 👀
            </h2>

            <p>
                And this is only the beginning...
            </p>

        </div>

    </section>


    <script>

        const button =
            document.getElementById("readyButton");

        const screen1 =
            document.getElementById("screen1");

        const screen2 =
            document.getElementById("screen2");


        /*
        ============================================
        SETTINGS
        ============================================
        */

        let escapeCount = 0;

        let buttonEscaping = false;

        /*
        Distance at which the button
        notices the pointer.

        Increase this number if you want
        the button to escape earlier.
        */

        const detectionDistance = 125;


        /*
        ============================================
        GET BUTTON POSITION
        ============================================
        */

        function getButtonRect() {

            return button.getBoundingClientRect();

        }


        /*
        ============================================
        MOVE BUTTON
        ============================================
        */

        function moveButtonAway(pointerX, pointerY) {

            if (buttonEscaping) {
                return;
            }

            /*
            After enough escapes,
            stop running away.
            */

            if (escapeCount >= 2) {
                return;
            }


            const rect =
                getButtonRect();


            const buttonCenterX =
                rect.left + rect.width / 2;


            const buttonCenterY =
                rect.top + rect.height / 2;


            const distanceX =
                pointerX - buttonCenterX;


            const distanceY =
                pointerY - buttonCenterY;


            const distance =
                Math.sqrt(
                    distanceX * distanceX +
                    distanceY * distanceY
                );


            /*
            Pointer is close enough.
            */

            if (distance < detectionDistance) {

                escapeButton(
                    pointerX,
                    pointerY
                );

            }

        }


        /*
        ============================================
        ESCAPE BUTTON
        ============================================
        */

        function escapeButton(pointerX, pointerY) {

            buttonEscaping = true;

            escapeCount++;


            /*
            Current button position
            */

            const rect =
                getButtonRect();


            const currentX =
                rect.left + rect.width / 2;


            const currentY =
                rect.top + rect.height / 2;


            /*
            Direction from pointer
            to button.
            */

            let dx =
                currentX - pointerX;


            let dy =
                currentY - pointerY;


            const length =
                Math.sqrt(dx * dx + dy * dy);


            /*
            Prevent division by zero.
            */

            if (length === 0) {

                dx = 0;
                dy = -1;

            } else {

                dx /= length;
                dy /= length;

            }


            /*
            How far the button escapes.
            */

            const escapeDistance =
                150;


            let newX =
                currentX +
                dx * escapeDistance;


            let newY =
                currentY +
                dy * escapeDistance;


            /*
            Keep button inside screen.
            */

            const margin = 35;


            const halfWidth =
                rect.width / 2;


            const halfHeight =
                rect.height / 2;


            newX =
                Math.max(
                    halfWidth + margin,
                    Math.min(
                        window.innerWidth -
                        halfWidth -
                        margin,
                        newX
                    )
                );


            newY =
                Math.max(
                    halfHeight + margin,
                    Math.min(
                        window.innerHeight -
                        halfHeight -
                        margin,
                        newY
                    )
                );


            /*
            Convert to percentage
            position.
            */

            const xPercent =
                (newX / window.innerWidth) * 100;


            const yPercent =
                (newY / window.innerHeight) * 100;


            button.style.left =
                xPercent + "%";


            button.style.top =
                yPercent + "%";


            /*
            Allow another interaction
            after movement finishes.
            */

            setTimeout(() => {

                buttonEscaping = false;

            }, 650);

        }


        /*
        ============================================
        DESKTOP / MOUSE
        ============================================
        */

        document.addEventListener(
            "mousemove",
            function(event) {

                moveButtonAway(
                    event.clientX,
                    event.clientY
                );

            }
        );


        /*
        ============================================
        TOUCH / MOBILE
        ============================================
        */

        document.addEventListener(
            "touchmove",
            function(event) {

                if (
                    !event.touches ||
                    event.touches.length === 0
                ) {
                    return;
                }


                const touch =
                    event.touches[0];


                moveButtonAway(
                    touch.clientX,
                    touch.clientY
                );

            },
            {
                passive: true
            }
        );


        /*
        ============================================
        CLICK BEHAVIOR
        ============================================
        */

        button.addEventListener(
            "click",
            function(event) {

                event.preventDefault();


                /*
                If the button has escaped twice,
                allow the third interaction
                to open Screen 2.
                */

                if (escapeCount >= 2) {

                    /*
                    Put button back to center.
                    */

                    button.style.left = "50%";

                    button.style.top = "50%";


                    /*
                    Small pause so the user
                    sees the button return.
                    */

                    setTimeout(() => {

                        screen1.classList.add(
                            "hidden"
                        );

                        screen2.classList.remove(
                            "hidden"
                        );

                    }, 650);

                }

            }
        );


        /*
        ============================================
        RESET POSITION ON RESIZE
        ============================================
        */

        window.addEventListener(
            "resize",
            function() {

                if (escapeCount < 2) {

                    button.style.left =
                        "50%";

                    button.style.top =
                        "50%";

                }

            }
        );

    </script>

</body>
</html>
