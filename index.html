<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Buddu Thalli Birthday ❤️</title>

<style>

/* =========================================================
   BASIC
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    overflow-x: hidden;

    background:
        radial-gradient(
            circle at 50% 35%,
            #42104f 0%,
            #210725 35%,
            #100315 65%,
            #060208 100%
        );

    color: white;

    font-family:
        Georgia,
        "Times New Roman",
        serif;
}


/* =========================================================
   COMMON SCREEN
========================================================= */

.screen {

    position: relative;

    width: 100%;
    min-height: 100vh;

    display: none;

    align-items: center;
    justify-content: center;

    text-align: center;

    overflow: hidden;
}

.screen.active {
    display: flex;
}


/* =========================================================
   FLOATING BALLOONS
========================================================= */

.balloon {

    position: fixed;

    width: 55px;
    height: 70px;

    border-radius: 50%;

    opacity: .8;

    z-index: 1;

    animation:
        floatBalloon 6s ease-in-out infinite;
}

.balloon::after {

    content: "";

    position: absolute;

    width: 1px;
    height: 100px;

    background:
        rgba(255,255,255,.4);

    left: 50%;
    top: 65px;
}

.balloon1 {

    left: 5%;
    top: 15%;

    background: #ff5c8a;
}

.balloon2 {

    left: 15%;
    top: 70%;

    background: #a855f7;

    animation-delay: 1s;
}

.balloon3 {

    right: 7%;
    top: 18%;

    background: #ec4899;

    animation-delay: 2s;
}

.balloon4 {

    right: 17%;
    top: 72%;

    background: #8b5cf6;

    animation-delay: 3s;
}

.balloon5 {

    left: 40%;
    top: 8%;

    background: #f472b6;

    animation-delay: 1.5s;
}

.balloon6 {

    right: 40%;
    top: 82%;

    background: #c084fc;

    animation-delay: 2.5s;
}

@keyframes floatBalloon {

    0%,100% {

        transform:
            translateY(0)
            rotate(-3deg);
    }

    50% {

        transform:
            translateY(-18px)
            rotate(3deg);
    }
}


/* =========================================================
   FLOATING HEARTS
========================================================= */

.heart {

    position: fixed;

    font-size: 30px;

    opacity: .7;

    z-index: 1;

    animation:
        floatHeart 7s ease-in-out infinite;
}

.heart1 {
    left: 12%;
    top: 40%;
}

.heart2 {

    right: 12%;
    top: 45%;

    animation-delay: 1s;
}

.heart3 {

    left: 27%;
    bottom: 10%;

    animation-delay: 2s;
}

.heart4 {

    right: 28%;
    top: 12%;

    animation-delay: 3s;
}

@keyframes floatHeart {

    0%,100% {

        transform:
            translateY(0);

        opacity: .5;
    }

    50% {

        transform:
            translateY(-15px);

        opacity: .9;
    }
}


/* =========================================================
   FIRST SCREEN
========================================================= */

.first-content {

    width:
        min(900px, 92%);

    position: relative;

    z-index: 5;
}

.small-heading {

    font-size: 14px;

    letter-spacing: 5px;

    opacity: .8;

    margin-bottom: 20px;
}

.main-title {

    font-size:
        clamp(55px, 8vw, 105px);

    line-height: .94;

    font-weight: bold;

    text-shadow:

        0 0 10px
        rgba(255,255,255,.8),

        0 0 30px
        rgba(255,80,220,.4);
}

.subtitle {

    width:
        min(700px, 95%);

    margin:
        30px auto 0;

    font-size:
        clamp(17px, 2.2vw, 24px);

    line-height: 1.6;

    color:
        rgba(255,255,255,.88);
}

.question {

    margin-top: 35px;

    font-size:
        clamp(19px, 2.5vw, 29px);

    line-height: 1.45;

    font-weight: bold;
}

.ready-area {

    margin-top: 30px;

    min-height: 70px;
}

#readyButton {

    border:
        1px solid
        rgba(255,255,255,.6);

    background:
        linear-gradient(
            135deg,
            #e85caf,
            #9f3edb
        );

    color: white;

    border-radius: 999px;

    padding:
        15px 34px;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 14px;

    font-weight: bold;

    letter-spacing: 1px;

    cursor: pointer;

    box-shadow:

        0 0 15px
        rgba(255,80,220,.45),

        0 0 30px
        rgba(180,70,230,.25);

    transition:

        left .55s ease,
        top .55s ease,
        transform .25s ease,
        box-shadow .25s ease;

    position: relative;

    z-index: 50;
}

#readyButton:hover {

    transform: scale(1.05);

    box-shadow:

        0 0 20px
        rgba(255,80,220,.7),

        0 0 40px
        rgba(180,70,230,.4);
}

#readyButton.random-position {

    position: fixed;

    z-index: 9999;
}


/* =========================================================
   SECOND SCREEN
========================================================= */

.second-content {

    width:
        min(850px, 92%);

    position: relative;

    z-index: 5;
}

.second-title {

    font-size:
        clamp(55px, 8vw, 100px);

    text-shadow:

        0 0 10px white,

        0 0 30px
        rgba(255,80,220,.4);
}

.second-text {

    margin-top: 25px;

    font-size:
        clamp(18px, 2.4vw, 27px);

    line-height: 1.6;
}

.go-button,
.bubu-button {

    margin-top: 32px;

    border:
        1px solid
        rgba(255,255,255,.6);

    background:
        linear-gradient(
            135deg,
            #e85caf,
            #9f3edb
        );

    color: white;

    border-radius: 999px;

    padding:
        15px 34px;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 14px;

    font-weight: bold;

    letter-spacing: 1px;

    cursor: pointer;

    box-shadow:
        0 0 15px
        rgba(255,80,220,.45);

    transition:
        transform .25s ease;
}

.go-button:hover,
.bubu-button:hover {

    transform:
        scale(1.05);
}


/* =========================================================
   PRAYER SCREEN
========================================================= */

.prayer-container {

    width:
        min(900px, 94%);

    max-height: 94vh;

    overflow-y: auto;

    position: relative;

    z-index: 5;

    scrollbar-width: none;
}

.prayer-container::-webkit-scrollbar {
    display: none;
}

.assalam {

    font-size:
        clamp(27px, 4vw, 48px);

    line-height: 1.3;

    text-shadow:

        0 0 10px white,

        0 0 25px
        rgba(255,80,220,.35);
}

.prayer {

    margin:
        30px auto 0;

    width:
        min(800px, 95%);
}

.roman-prayer p,
.telugu-meaning p {

    margin: 16px 0;

    font-size:
        clamp(17px, 2vw, 23px);

    line-height: 1.7;
}

.prayer-divider {

    margin: 25px 0;

    font-size: 25px;
}

.ameen {

    margin-top: 22px;

    font-size: 30px;

    font-weight: bold;
}

.celebrate-button {

    margin-top: 28px;

    opacity: 0;

    pointer-events: none;

    border:
        1px solid
        rgba(255,255,255,.6);

    background:
        linear-gradient(
            135deg,
            #e85caf,
            #9f3edb
        );

    color: white;

    border-radius: 999px;

    padding:
        16px 32px;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 14px;

    font-weight: bold;

    letter-spacing: 1px;

    cursor: pointer;

    box-shadow:
        0 0 15px
        rgba(255,80,220,.45);

    transition:
        opacity .6s ease,
        transform .25s ease;
}

.celebrate-button.show {

    opacity: 1;

    pointer-events: auto;
}

.celebrate-button:hover {

    transform:
        scale(1.05);
}


/* =========================================================
   FULL SCREEN NEW SCREENS
========================================================= */

.new-screen {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100vh;

    display: none;

    align-items: center;
    justify-content: center;

    text-align: center;

    overflow: hidden;

    z-index: 1000;

    background:

        radial-gradient(
            circle at center,
            #42104f,
            #18051e 55%,
            #060208
        );
}

.new-screen.active {
    display: flex;
}


/* =========================================================
   PHONE VIDEO
========================================================= */

.phone-video {

    width: 100%;
    height: 100%;

    object-fit: contain;

    background: #060208;

    display: block;
}


/* =========================================================
   PHONE SWIPE OVERLAY
========================================================= */

.phone-swipe-overlay {
    position: absolute;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    width: min(360px, 86vw);
    z-index: 20;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    pointer-events: none;
}

.phone-swipe-overlay.show { display: flex; }

.phone-swipe-text {
    color: #fff;
    font-weight: bold;
    font-size: 13px;
    letter-spacing: 1px;
    text-shadow: 0 2px 8px rgba(0,0,0,.9);
}

.swipe-track {
    position: relative;
    width: 320px;
    max-width: 86vw;
    height: 58px;
    border-radius: 999px;
    background: rgba(0,0,0,.58);
    border: 1px solid rgba(255,255,255,.65);
    box-shadow: 0 5px 22px rgba(0,0,0,.45);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: bold;
    font-size: 12px;
    letter-spacing: 1px;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    pointer-events: auto;
    overflow: hidden;
}

.swipe-thumb {
    position: absolute;
    left: 4px;
    top: 4px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: linear-gradient(135deg,#ff73c8,#9d3de0);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow: 0 0 15px rgba(255,120,220,.7);
    cursor: grab;
}

.swipe-thumb:active { cursor: grabbing; }

@media (max-width: 600px) {
    .phone-swipe-overlay { bottom: 20px; }
    .phone-swipe-text { font-size: 11px; }
}


/* =========================================================
   HAPPY BIRTHDAY SCREEN
========================================================= */

.new-birthday-content {

    width:
        min(900px, 92%);

    position: relative;

    z-index: 5;
}

.new-small-heading {

    font-size: 14px;

    letter-spacing: 5px;

    opacity: .85;

    margin-bottom: 20px;
}

.new-birthday-title {

    font-size:
        clamp(55px, 8vw, 105px);

    line-height: .95;

    font-weight: bold;

    text-shadow:

        0 0 10px white,

        0 0 25px
        rgba(255,80,220,.45),

        0 0 45px
        rgba(170,70,255,.3);
}

.new-birthday-name {

    margin-top: 18px;

    font-size:
        clamp(32px, 5vw, 60px);

    color:
        #ffd1f1;

    font-weight: bold;

    text-shadow:

        0 0 15px
        rgba(255,100,220,.7);
}

.new-birthday-message {

    width:
        min(750px, 94%);

    margin:
        28px auto 0;

    font-size:
        clamp(17px, 2.2vw, 24px);

    line-height: 1.7;

    color:
        rgba(255,255,255,.92);
}


/* =========================================================
   DOOR SCREEN
========================================================= */

.door-screen {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100vh;

    display: none;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    text-align: center;

    overflow: hidden;

    z-index: 2000;

    background:

        radial-gradient(
            circle at center,
            #42104f 0%,
            #210725 40%,
            #09020d 100%
        );
}

.door-screen.active {
    display: flex;
}


/* =========================================================
   DOOR TEXT
========================================================= */

.door-title {

    position: relative;

    z-index: 20;

    width:
        min(850px, 92%);

    margin-bottom: 25px;

    font-size:
        clamp(30px, 5vw, 65px);

    line-height: 1.2;

    color: white;

    text-shadow:

        0 0 10px white,

        0 0 25px
        rgba(255,80,220,.5),

        0 0 50px
        rgba(180,70,230,.35);

    animation:
        doorTextGlow 2s ease-in-out infinite;
}

@keyframes doorTextGlow {

    0%,100% {

        opacity: .9;

        transform:
            translateY(0);
    }

    50% {

        opacity: 1;

        transform:
            translateY(-4px);
    }
}

.door-subtitle {

    position: relative;

    z-index: 20;

    margin-bottom: 25px;

    font-size:
        clamp(16px, 2.3vw, 23px);

    color:
        rgba(255,255,255,.85);
}


/* =========================================================
   DOOR FRAME
========================================================= */

.door-frame {

    position: relative;

    width:
        min(340px, 72vw);

    height:
        min(460px, 60vh);

    perspective: 1400px;

    z-index: 10;

    cursor: pointer;

    filter:
        drop-shadow(
            0 0 25px
            rgba(190,70,230,.5)
        );
}


/* =========================================================
   DOOR BACKGROUND
========================================================= */

.door-inside {

    position: absolute;

    inset: 0;

    border-radius:
        14px 14px 5px 5px;

    overflow: hidden;

    background:

        radial-gradient(
            circle at 50% 45%,
            #c23d91,
            #4c125e 35%,
            #16051d 75%
        );

    box-shadow:

        inset 0 0 60px
        rgba(255,80,220,.3),

        0 0 40px
        rgba(180,70,230,.35);
}


/* =========================================================
   HEART BEHIND DOOR
========================================================= */

.door-heart {

    position: absolute;

    left: 50%;
    top: 43%;

    transform:
        translate(-50%, -50%);

    font-size:
        clamp(65px, 10vw, 110px);

    filter:
        drop-shadow(
            0 0 20px
            rgba(255,80,160,.8)
        );

    animation:
        heartBeat 1.2s infinite;
}

@keyframes heartBeat {

    0%,100% {

        transform:
            translate(-50%, -50%)
            scale(1);
    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.12);
    }
}


/* =========================================================
   ACTUAL DOORS
========================================================= */

.door-left,
.door-right {

    position: absolute;

    top: 0;

    width: 50%;

    height: 100%;

    background:

        linear-gradient(
            90deg,
            #22062e,
            #54105f 45%,
            #26072f
        );

    border:
        3px solid
        #d88bd5;

    box-shadow:

        inset 0 0 25px
        rgba(255,100,220,.25);
}


/* LEFT */

.door-left {

    left: 0;

    transform-origin:
        left center;

    border-radius:
        14px 0 0 5px;

    transition:
        transform 1.1s cubic-bezier(.7,0,.2,1);
}


/* RIGHT */

.door-right {

    right: 0;

    transform-origin:
        right center;

    border-radius:
        0 14px 5px 0;

    transition:
        transform 1.1s cubic-bezier(.7,0,.2,1);
}


/* =========================================================
   DOOR DETAILS
========================================================= */

.door-panel {

    position: absolute;

    left: 14%;
    right: 14%;
    top: 12%;
    bottom: 12%;

    border:
        2px solid
        rgba(255,200,250,.35);

    border-radius: 8px;
}

.door-handle {

    position: absolute;

    top: 50%;

    width: 13px;
    height: 13px;

    border-radius: 50%;

    background:
        #ffd36e;

    box-shadow:
        0 0 12px
        rgba(255,210,100,.8);

    z-index: 10;
}

.door-left .door-handle {

    right: 10px;
}

.door-right .door-handle {

    left: 10px;
}


/* =========================================================
   DOOR OPEN STATE
========================================================= */

.door-screen.opening .door-left {

    transform:
        rotateY(-105deg);
}

.door-screen.opening .door-right {

    transform:
        rotateY(105deg);
}

.door-screen.opening .door-title,
.door-screen.opening .door-subtitle {

    opacity: 0;

    transition:
        opacity .5s ease;
}


/* =========================================================
   TOUCH HINT
========================================================= */

.touch-door {

    position: relative;

    z-index: 20;

    margin-top: 22px;

    font-size: 14px;

    letter-spacing: 2px;

    opacity: .85;

    animation:
        touchPulse 1.6s ease-in-out infinite;
}

@keyframes touchPulse {

    0%,100% {
        opacity: .5;
    }

    50% {
        opacity: 1;
    }
}


/* =========================================================
   BUBU FLYING VIDEO
========================================================= */

.bubu-video-screen {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100vh;

    display: none;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    z-index: 3000;

    background: #060208;
}

.bubu-video-screen.active {
    display: flex;
}

.bubu-video {

    width: 100vw;
    height: 100vh;

    object-fit: contain;

    background: #060208;

    display: block;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .small-heading {

        font-size: 10px;

        letter-spacing: 3px;
    }

    .main-title {

        font-size: 48px;
    }

    .subtitle {

        font-size: 16px;

        line-height: 1.55;
    }

    .question {

        font-size: 20px;
    }

    #readyButton {

        padding:
            13px 27px;
    }

    .assalam {

        font-size: 27px;
    }

    .roman-prayer p,
    .telugu-meaning p {

        font-size: 16px;

        line-height: 1.65;
    }

    .celebrate-button {

        width: 90%;

        max-width: 330px;

        font-size: 14px;

        padding:
            15px 20px;
    }

    .new-small-heading {

        font-size: 10px;

        letter-spacing: 3px;
    }

    .new-birthday-title {

        font-size: 52px;
    }

    .new-birthday-name {

        font-size: 34px;
    }

    .new-birthday-message {

        font-size: 17px;

        line-height: 1.65;
    }

    .door-title {

        font-size: 31px;
    }

    .door-subtitle {

        font-size: 17px;
    }

    .door-frame {

        width: 250px;

        height: 360px;
    }

    .touch-door {

        font-size: 12px;

        letter-spacing: 1.5px;
    }
}



/* =========================================================
   24 GIFT SURPRISE SCREEN
========================================================= */

.gift-surprise-screen {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 1000;
    overflow: hidden;
    padding: 28px 16px;
    background:
        radial-gradient(circle at 50% 42%, rgba(133,35,154,.34), transparent 30%),
        radial-gradient(circle at 50% 80%, rgba(88,16,108,.20), transparent 42%),
        #100014;
}

.gift-surprise-screen.active {
    display: flex;
    animation: giftScreenIn .7s ease forwards;
}

@keyframes giftScreenIn {
    from { opacity: 0; transform: scale(.98); }
    to { opacity: 1; transform: scale(1); }
}

.gift-heading-wrap {
    text-align: center;
    margin-bottom: 24px;
    z-index: 2;
}

.gift-heading-wrap .gift-eyebrow {
    font-size: 9px;
    letter-spacing: 6px;
    text-transform: uppercase;
    opacity: .62;
    margin-bottom: 9px;
}

.gift-heading-wrap h1 {
    font-size: clamp(40px, 6vw, 72px);
    line-height: .98;
    text-shadow:
        0 0 8px #fff,
        0 0 20px rgba(255,170,255,.85),
        0 0 40px rgba(218,73,242,.5);
}

.gift-heading-wrap .gift-subtle {
    margin-top: 11px;
    font-size: 11px;
    letter-spacing: 2px;
    opacity: .52;
}

.gift-grid-new {
    width: min(650px, 94vw);
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 12px;
    z-index: 2;
}

.gift-box-new {
    position: relative;
    aspect-ratio: 1 / 1;
    cursor: pointer;
    transform: translateZ(0);
    transition: transform .25s ease, filter .25s ease;
    filter: drop-shadow(0 7px 11px rgba(0,0,0,.26));
}

.gift-box-new:hover {
    transform: translateY(-5px) scale(1.035);
    filter: drop-shadow(0 0 15px rgba(231,88,247,.52));
}

.gift-box-new:active {
    transform: scale(.97);
}

.gift-box-body-new {
    position: absolute;
    left: 8%;
    right: 8%;
    bottom: 5%;
    height: 67%;
    border: 1px solid rgba(255,218,255,.46);
    border-radius: 5px;
    background: linear-gradient(90deg,#35143e,#63216c 46%,#42174a);
    box-shadow:
        inset 0 0 18px rgba(255,90,232,.14),
        0 5px 12px rgba(0,0,0,.24);
}

.gift-box-body-new::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 43%;
    width: 14%;
    background: linear-gradient(90deg,rgba(255,95,225,.25),rgba(255,190,247,.75),rgba(255,95,225,.25));
}

.gift-box-body-new::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 42%;
    height: 16%;
    background: linear-gradient(0deg,rgba(255,95,225,.25),rgba(255,190,247,.75),rgba(255,95,225,.25));
}

.gift-box-lid-new {
    position: absolute;
    left: 4%;
    right: 4%;
    top: 17%;
    height: 23%;
    border: 1px solid rgba(255,225,255,.58);
    border-radius: 6px;
    background: linear-gradient(145deg,#68266f,#822f87 48%,#481950);
    box-shadow: inset 0 0 12px rgba(255,130,245,.2), 0 0 10px rgba(220,70,240,.16);
    z-index: 3;
    transition: transform .55s cubic-bezier(.2,.8,.2,1);
}

.gift-box-lid-new::after {
    content: "";
    position: absolute;
    left: 42.5%;
    top: 0;
    bottom: 0;
    width: 15%;
    background: linear-gradient(90deg,rgba(255,100,225,.27),rgba(255,195,248,.78),rgba(255,100,225,.27));
}

.gift-bow-new {
    position: absolute;
    left: 50%;
    top: 9%;
    width: 32px;
    height: 22px;
    transform: translateX(-50%);
    z-index: 6;
}

.gift-bow-new::before,
.gift-bow-new::after {
    content: "";
    position: absolute;
    width: 18px;
    height: 13px;
    top: 3px;
    background: linear-gradient(135deg,#f47bdd,#a82d9f);
    box-shadow: 0 0 8px rgba(255,100,235,.38);
}

.gift-bow-new::before {
    left: 0;
    border-radius: 12px 3px 12px 3px;
    transform: rotate(-25deg);
}

.gift-bow-new::after {
    right: 0;
    border-radius: 3px 12px 3px 12px;
    transform: rotate(25deg);
}

.gift-knot-new {
    position: absolute;
    left: 50%;
    top: 13%;
    width: 10px;
    height: 10px;
    transform: translate(-50%,-50%);
    border-radius: 50%;
    background: #ffd5f8;
    box-shadow: 0 0 10px #ff9eed;
    z-index: 7;
}

.gift-box-new.opening .gift-box-lid-new {
    transform: translateY(-17px) rotateX(18deg);
}

.gift-box-new.opening {
    animation: giftBoxOpen .65s ease;
}

@keyframes giftBoxOpen {
    0% { transform: scale(1); }
    40% { transform: scale(1.08); filter: drop-shadow(0 0 25px rgba(250,100,255,.9)); }
    100% { transform: scale(1); }
}
