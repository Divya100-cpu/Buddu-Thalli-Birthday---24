<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Something Is Waiting</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    background:
        radial-gradient(
            circle at 50% 38%,
            rgba(112, 26, 126, 0.30),
            transparent 38%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(104, 20, 115, 0.20),
            transparent 45%
        ),
        #100014;

    color: white;
    font-family: Georgia, "Times New Roman", serif;
}

/* =========================
   BACKGROUND
========================= */

.background-circle {
    position: fixed;
    width: 650px;
    height: 650px;
    left: 50%;
    top: 45%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 1px solid rgba(255, 125, 244, 0.07);

    box-shadow:
        0 0 100px rgba(220, 70, 240, 0.06),
        inset 0 0 100px rgba(220, 70, 240, 0.035);

    pointer-events: none;
}

.particle {
    position: fixed;
    width: 4px;
    height: 4px;
    border-radius: 50%;

    background: #ff7ce8;

    box-shadow:
        0 0 10px #ff5cde,
        0 0 18px rgba(255, 75, 222, 0.6);

    opacity: 0.5;

    animation: floatParticle linear infinite;

    pointer-events: none;
}

@keyframes floatParticle {

    0% {
        transform:
            translateY(105vh)
            translateX(0);
        opacity: 0;
    }

    15% {
        opacity: 0.7;
    }

    80% {
        opacity: 0.7;
    }

    100% {
        transform:
            translateY(-20vh)
            translateX(80px);
        opacity: 0;
    }
}

/* =========================
   GENERAL SCREEN
========================= */

.screen {
    position: relative;
    z-index: 2;

    width: 100%;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 30px 20px;
}

.hidden {
    display: none !important;
}

/* =========================
   GIFT SCREEN
========================= */

.gift-screen {
    flex-direction: column;

    justify-content: flex-start;

    padding-top: 60px;
}

.small-heading {
    font-size: 9px;

    letter-spacing: 5px;

    color:
        rgba(255,255,255,0.58);

    margin-bottom: 12px;

    text-transform: uppercase;
}

.main-heading {

    font-size:
        clamp(42px, 6vw, 70px);

    line-height: 0.95;

    text-align: center;

    font-weight: bold;

    letter-spacing: -2px;

    margin-bottom: 12px;

    text-shadow:
        0 0 7px white,
        0 0 18px rgba(255,155,255,0.85),
        0 0 40px rgba(240,70,255,0.4);
}

.heading-subtitle {

    font-size: 12px;

    color:
        rgba(255,255,255,0.68);

    text-align: center;

    margin-bottom: 27px;

    letter-spacing: 0.5px;
}

/* =========================
   24 GIFT GRID
========================= */

.gift-grid {

    width:
        min(460px, 94vw);

    display: grid;

    grid-template-columns:
        repeat(6, 1fr);

    gap: 9px;

    position: relative;

    z-index: 5;
}

/* =========================
   GIFT BOX
========================= */

.gift-box {

    position: relative;

    aspect-ratio: 1 / 1;

    border:
        1px solid
        rgba(255,190,255,0.46);

    border-radius: 9px;

    background:
        linear-gradient(
            145deg,
            rgba(112,43,122,0.42),
            rgba(54,18,62,0.75)
        );

    overflow: hidden;

    cursor: pointer;

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        border-color 0.25s ease;
}

.gift-box:hover {

    transform:
        translateY(-4px)
        scale(1.025);

    border-color:
        rgba(255,190,255,0.85);

    box-shadow:
        0 0 18px
        rgba(245,70,236,0.35);
}

/* Horizontal ribbon */

.gift-box::before {

    content: "";

    position: absolute;

    left: -5%;
    right: -5%;

    top: 18%;

    height: 9%;

    background:
        linear-gradient(
            90deg,
            rgba(255,83,220,0.04),
            rgba(255,106,227,0.92),
            rgba(255,83,220,0.04)
        );

    box-shadow:
        0 0 12px
        rgba(255,82,221,0.55);
}

/* Vertical ribbon */

.gift-box::after {

    content: "";

    position: absolute;

    top: -5%;
    bottom: -5%;

    left: 45%;

    width: 10%;

    background:
        linear-gradient(
            90deg,
            rgba(255,80,219,0.05),
            rgba(255,104,229,0.88),
            rgba(255,80,219,0.05)
        );

    box-shadow:
        0 0 12px
        rgba(255,82,221,0.42);
}

/* =========================
   RIBBON BOW
========================= */

.ribbon {

    position: absolute;

    z-index: 4;

    left: 45%;

    top: 18%;

    width: 11px;
    height: 11px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: #ff9bea;

    box-shadow:
        0 0 8px #ff78e5,
        0 0 16px rgba(255,75,222,0.75);
}

.ribbon::before,
.ribbon::after {

    content: "";

    position: absolute;

    top: 1px;

    width: 15px;

    height: 9px;

    background:
        rgba(255,128,233,0.85);

    border:
        1px solid
        rgba(255,215,250,0.38);
}

.ribbon::before {

    right: 5px;

    transform:
        rotate(28deg);

    border-radius:
        8px 2px 8px 2px;
}

.ribbon::after {

    left: 5px;

    transform:
        rotate(-28deg);

    border-radius:
        2px 8px 2px 8px;
}

/* =========================
   BOX NUMBER
========================= */

.box-number {

    position: absolute;

    right: 6px;

    bottom: 5px;

    z-index: 8;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 7px;

    letter-spacing: 1px;

    color:
        rgba(255,255,255,0.42);
}

/* =========================
   OPENED BOX
========================= */

.gift-box.opened {

    opacity: 0.38;

    transform:
        scale(0.95);

    border-color:
        rgba(255,185,255,0.20);

    box-shadow: none;
}

.gift-box.opened:hover {

    transform:
        scale(0.95);
}

/* =========================
   POPUP
========================= */

.hint-overlay {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 25px;

    background:
        rgba(9,0,14,0.48);

    backdrop-filter:
        blur(5px);

    animation:
        overlayIn 0.25s ease;

    cursor: pointer;
}

.hint-card {

    width:
        min(420px, 90vw);

    min-height: 150px;

    padding:
        38px 28px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    border:
        1px solid
        rgba(255,190,255,0.36);

    border-radius: 17px;

    background:
        linear-gradient(
            145deg,
            rgba(82,27,94,0.97),
            rgba(39,9,47,0.98)
        );

    box-shadow:
        0 0 40px
        rgba(220,68,239,0.25),

        inset 0 0 30px
        rgba(255,130,240,0.05);

    cursor: pointer;

    animation:
        popupIn 0.28s ease;
}

.hint-text {

    font-size:
        clamp(18px, 3vw, 23px);

    line-height: 1.45;

    color: white;

    text-shadow:
        0 0 10px
        rgba(255,255,255,0.22);
}

.hint-mini {

    margin-top: 17px;

    font-size: 7px;

    letter-spacing: 3px;

    color:
        rgba(255,255,255,0.38);

    text-transform: uppercase;
}

@keyframes overlayIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

@keyframes popupIn {

    from {
        opacity: 0;

        transform:
            scale(0.85)
            translateY(12px);
    }

    to {
        opacity: 1;

        transform:
            scale(1)
            translateY(0);
    }
}

/* =========================
   INVITATION
========================= */

.invitation-screen {

    animation:
        invitationIn 1s ease;
}

.invitation-card {

    width:
        min(500px, 92vw);

    padding:
        43px 34px;

    text-align: center;

    border:
        1px solid
        rgba(255,193,255,0.42);

    border-radius: 18px;

    background:
        linear-gradient(
            145deg,
            rgba(91,33,99,0.72),
            rgba(45,12,51,0.85)
        );

    box-shadow:

        0 0 60px
        rgba(219,68,237,0.17),

        inset 0 0 35px
        rgba(255,145,238,0.05);
}

.invitation-label {

    font-size: 8px;

    letter-spacing: 6px;

    color:
        rgba(255,255,255,0.56);

    margin-bottom: 18px;

    text-transform: uppercase;
}

.invitation-title {

    font-size:
        clamp(46px, 7vw, 68px);

    line-height: 0.95;

    margin-bottom: 27px;

    text-shadow:
        0 0 7px white,
        0 0 18px rgba(255,150,255,0.75),
        0 0 35px rgba(239,77,255,0.35);
}

.invitation-date {

    font-size: 27px;

    font-weight: bold;

    letter-spacing: 1px;

    margin-bottom: 5px;
}

.invitation-time {

    font-size: 10px;

    letter-spacing: 5px;

    color:
        rgba(255,255,255,0.72);

    margin-bottom: 23px;
}

.invitation-divider {

    width: 55px;

    height: 1px;

    margin:
        0 auto 23px;

    background:
        rgba(255,190,255,0.55);
}

.invitation-lines {

    font-size: 15px;

    line-height: 1.75;

    font-weight: bold;
}

.invitation-sealed {

    margin-top: 19px;

    font-size: 8px;

    letter-spacing: 3px;

    color:
        rgba(255,255,255,0.44);
}

@keyframes invitationIn {

    from {

        opacity: 0;

        transform:
            scale(1.04);
    }

    to {

        opacity: 1;

        transform:
            scale(1);
    }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .gift-screen {

        padding-top: 45px;
    }

    .main-heading {

        font-size: 43px;
    }

    .heading-subtitle {

        font-size: 10px;

        margin-bottom: 22px;
    }

    .gift-grid {

        width:
            min(410px, 94vw);

        grid-template-columns:
            repeat(4, 1fr);

        gap: 8px;
    }

    .invitation-card {

        padding:
            38px 25px;
    }

    .invitation-title {

        font-size: 49px;
    }
}

@media (max-width: 390px) {

    .gift-grid {

        gap: 7px;
    }

    .box-number {

        display: none;
    }

    .main-heading {

        font-size: 39px;
    }
}
</style>
</head>

<body>

<!-- Background -->

<div class="background-circle"></div>

<div class="particle"
     style="left:12%;animation-duration:11s;animation-delay:-2s;">
</div>

<div class="particle"
     style="left:27%;animation-duration:14s;animation-delay:-7s;">
</div>

<div class="particle"
     style="left:44%;animation-duration:12s;animation-delay:-4s;">
</div>

<div class="particle"
     style="left:62%;animation-duration:15s;animation-delay:-9s;">
</div>

<div class="particle"
     style="left:79%;animation-duration:10s;animation-delay:-5s;">
</div>

<div class="particle"
     style="left:91%;animation-duration:13s;animation-delay:-1s;">
</div>


<!-- =====================================================
     EXISTING AUDIO FILE
     DO NOT DELETE THE FILE FROM GITHUB
===================================================== -->

<audio id="heyRangule" preload="auto">
    <source
        src="Hey Rangule - NaaSongsHD.mp3"
        type="audio/mpeg">
</audio>


<!-- =====================================================
     NEW 24 GIFT SCREEN
===================================================== -->

<section
    id="giftScreen"
    class="screen gift-screen">

    <div class="small-heading">
        Something is waiting
    </div>

    <h1 class="main-heading">
        OPEN CAREFULLY.
    </h1>

    <div class="heading-subtitle">
        Some things are better discovered.
    </div>

    <div
        id="giftGrid"
        class="gift-grid">
    </div>

</section>


<!-- =====================================================
     HINT POPUP
     NO CLOSE BUTTON
===================================================== -->

<div
    id="hintOverlay"
    class="hint-overlay hidden">

    <div
        id="hintCard"
        class="hint-card">

        <div
            id="hintText"
            class="hint-text">
        </div>

        <div class="hint-mini">
            something is waiting
        </div>

    </div>

</div>


<!-- =====================================================
     SAVE THE DATE
===================================================== -->

<section
    id="invitationScreen"
    class="screen invitation-screen hidden">

    <div class="invitation-card">

        <div class="invitation-label">
            A little something
        </div>

        <h1 class="invitation-title">
            SAVE<br>
            THE DATE
        </h1>

        <div class="invitation-date">
            30 OCTOBER
        </div>

        <div class="invitation-time">
            10:00 AM
        </div>

        <div class="invitation-divider"></div>

        <div class="invitation-lines">
            ONE MORNING.<br>
            ONE PLAN.<br>
            ONE PLACE.
        </div>

        <div class="invitation-sealed">
            PRIVATE THEATRE · LOCATION SEALED
        </div>

    </div>

</section>


<script>

/* =====================================================
   24 INDIRECT HINTS

   No actual gift names are revealed.
===================================================== */

const hints = [

    "Something you'll understand the moment you see it. 👀",

    "A little change can make a familiar look feel different.",

    "For one of those days when you want everything just right.",

    "Something small, but somehow always useful.",

    "A little detail that makes a big difference.",

    "This one belongs where you go. Not where you stay.",

    "For the days when the sun has plans of its own. ☀️",

    "Something you'll probably reach for more often than you think.",

    "A small thing that quietly completes the picture.",

    "For something you carry around every day.",

    "This one is closer to you than it looks.",

    "A little reminder worth keeping close.",

    "Something familiar… with a little more meaning.",

    "This one is meant to stay with you.",

    "For a corner that deserves a little light.",

    "A little care for the person wearing it.",

    "Another little bit of care. You'll know when.",

    "Sweetness was obviously necessary. 🍫",

    "Because one was never going to be enough.",

    "This one isn't meant to stay in a box for long.",

    "Something that makes a celebration feel like a celebration.",

    "A little protection for the journey.",

    "For the journeys where you need a little extra comfort.",

    "The biggest surprise is the one you won't guess from here."
];


/* =====================================================
   ELEMENTS
===================================================== */

const giftGrid =
    document.getElementById("giftGrid");

const hintOverlay =
    document.getElementById("hintOverlay");

const hintCard =
    document.getElementById("hintCard");

const hintText =
    document.getElementById("hintText");

const giftScreen =
    document.getElementById("giftScreen");

const invitationScreen =
    document.getElementById("invitationScreen");

const song =
    document.getElementById("heyRangule");


/* =====================================================
   STATE
===================================================== */

let openedCount = 0;

let musicStarted = false;

let currentGift = null;


/* =====================================================
   CREATE ALL 24 BOXES
===================================================== */

hints.forEach((hint, index) => {

    const box =
        document.createElement("div");

    box.className =
        "gift-box";

    box.innerHTML = `

        <div class="ribbon"></div>

        <div class="box-number">
            ${String(index + 1).padStart(2, "0")}
        </div>

    `;

    box.addEventListener(
        "click",
        () => openGift(box, index)
    );

    giftGrid.appendChild(box);

});


/* =====================================================
   START SONG
===================================================== */

function startSong() {

    if (musicStarted) {
        return;
    }

    musicStarted = true;

    /*
      ALWAYS START FROM 0:00
    */

    song.currentTime = 0;

    song.play().catch(() => {

        /*
          Browser may wait for another
          user interaction.
        */

        musicStarted = false;

    });

}


/* =====================================================
   OPEN GIFT
===================================================== */

function openGift(box, index) {

    /*
      First box interaction starts
      Hey Rangule from 0:00.
    */

    startSong();


    /*
      Don't count the same box twice.
    */

    if (!box.classList.contains("opened")) {

        box.classList.add("opened");

        openedCount++;

    }


    currentGift = index;

    hintText.textContent =
        hints[index];

    hintOverlay.classList.remove(
        "hidden"
    );

}


/* =====================================================
   CLOSE POPUP

   There is deliberately NO close button.

   Just tap the popup.
===================================================== */

hintCard.addEventListener(
    "click",
    closePopup
);


hintOverlay.addEventListener(
    "click",
    function(event) {

        if (
            event.target ===
            hintOverlay
        ) {

            closePopup();

        }

    }
);


function closePopup() {

    hintOverlay.classList.add(
        "hidden"
    );


    /*
      Once all 24 are opened,
      move to invitation.
    */

    if (openedCount >= 24) {

        setTimeout(
            showInvitation,
            450
        );

    }

}


/* =====================================================
   SHOW INVITATION
===================================================== */

function showInvitation() {

    /*
      IMPORTANT:
      Stop Hey Rangule immediately.
    */

    song.pause();

    song.currentTime = 0;


    /*
      Hide gift experience.
    */

    giftScreen.classList.add(
        "hidden"
    );

    hintOverlay.classList.add(
        "hidden"
    );


    /*
      Show Save The Date.
    */

    invitationScreen.classList.remove(
        "hidden"
    );


    window.scrollTo(
        0,
        0
    );

}


/* =====================================================
   SONG SAFETY
===================================================== */

song.addEventListener(
    "ended",
    function() {

        song.pause();

    }
);


/*
   If autoplay/playback is temporarily
   blocked, the next user interaction
   gets another chance.
*/

document.addEventListener(
    "pointerdown",
    function() {

        if (!musicStarted) {

            song.currentTime = 0;

            song.play()
                .then(() => {

                    musicStarted = true;

                })
                .catch(() => {});

        }

    }
);

</script>

</body>
</html>
