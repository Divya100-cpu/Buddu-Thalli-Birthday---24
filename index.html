<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Something</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    background:
        radial-gradient(circle at 50% 35%, rgba(111, 26, 125, 0.28), transparent 38%),
        radial-gradient(circle at 50% 100%, rgba(103, 19, 111, 0.18), transparent 45%),
        #100014;
    color: #fff;
    font-family: Georgia, "Times New Roman", serif;
}

/* ---------- BACKGROUND ---------- */

.background-glow {
    position: fixed;
    width: 700px;
    height: 700px;
    left: 50%;
    top: 45%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 1px solid rgba(244, 129, 255, 0.08);
    box-shadow:
        0 0 100px rgba(220, 72, 238, 0.08),
        inset 0 0 100px rgba(220, 72, 238, 0.04);
    pointer-events: none;
}

.particle {
    position: fixed;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #ff7de9;
    box-shadow: 0 0 12px #ff5cde;
    opacity: 0.65;
    animation: floatParticle linear infinite;
    pointer-events: none;
}

@keyframes floatParticle {
    0% {
        transform: translateY(30vh) translateX(0);
        opacity: 0;
    }

    20% {
        opacity: 0.7;
    }

    80% {
        opacity: 0.7;
    }

    100% {
        transform: translateY(-110vh) translateX(80px);
        opacity: 0;
    }
}

/* ---------- SCREENS ---------- */

.screen {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 45px 20px;
}

.hidden {
    display: none !important;
}

/* ---------- GIFT SCREEN ---------- */

.gift-page {
    flex-direction: column;
    justify-content: flex-start;
    padding-top: 78px;
}

.top-label {
    font-size: 9px;
    letter-spacing: 5px;
    font-weight: bold;
    color: rgba(255, 255, 255, 0.62);
    margin-bottom: 13px;
    text-transform: uppercase;
}

.main-title {
    font-size: clamp(42px, 6vw, 72px);
    line-height: 0.95;
    text-align: center;
    font-weight: bold;
    letter-spacing: -2px;
    text-shadow:
        0 0 7px rgba(255,255,255,0.95),
        0 0 18px rgba(255,150,255,0.8),
        0 0 38px rgba(239,77,255,0.4);
    margin-bottom: 12px;
}

.sub-title {
    color: rgba(255,255,255,0.7);
    font-size: 13px;
    letter-spacing: 1px;
    text-align: center;
    margin-bottom: 30px;
}

.gift-grid {
    width: min(610px, 94vw);
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 11px;
}

/* ---------- GIFT BOX ---------- */

.gift {
    position: relative;
    aspect-ratio: 1 / 1;
    border: 1px solid rgba(255, 196, 255, 0.45);
    border-radius: 11px;
    background:
        linear-gradient(
            145deg,
            rgba(130, 57, 139, 0.32),
            rgba(59, 20, 67, 0.7)
        );
    cursor: pointer;
    overflow: hidden;
    transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
}

.gift:hover {
    transform: translateY(-5px) scale(1.025);
    border-color: rgba(255, 178, 255, 0.9);
    box-shadow:
        0 0 20px rgba(240, 76, 255, 0.3),
        inset 0 0 18px rgba(255, 98, 239, 0.12);
}

/* gift lid */
.gift::before {
    content: "";
    position: absolute;
    left: -3%;
    right: -3%;
    top: 22%;
    height: 9%;
    background: linear-gradient(
        90deg,
        rgba(255, 102, 230, 0.05),
        rgba(255, 102, 230, 0.9),
        rgba(255, 102, 230, 0.05)
    );
    box-shadow: 0 0 13px rgba(255, 91, 228, 0.55);
}

/* vertical ribbon */
.gift::after {
    content: "";
    position: absolute;
    top: -3%;
    bottom: -3%;
    left: 45%;
    width: 10%;
    transform: translateX(-50%);
    background: linear-gradient(
        90deg,
        rgba(255, 85, 221, 0.08),
        rgba(255, 98, 226, 0.82),
        rgba(255, 85, 221, 0.08)
    );
    box-shadow: 0 0 12px rgba(255, 91, 228, 0.4);
}

/* ribbon knot */
.ribbon-knot {
    position: absolute;
    z-index: 4;
    left: 45%;
    top: 22%;
    transform: translate(-50%, -50%);
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #ff9bec;
    box-shadow:
        0 0 8px #ff7be9,
        0 0 16px rgba(255, 78, 222, 0.8);
}

/* ribbon bow */
.ribbon-knot::before,
.ribbon-knot::after {
    content: "";
    position: absolute;
    width: 15px;
    height: 9px;
    top: 1px;
    background: rgba(255, 125, 232, 0.82);
    border: 1px solid rgba(255, 205, 250, 0.45);
}

.ribbon-knot::before {
    right: 6px;
    transform: rotate(27deg);
    border-radius: 8px 2px 8px 2px;
}

.ribbon-knot::after {
    left: 6px;
    transform: rotate(-27deg);
    border-radius: 2px 8px 2px 8px;
}

.gift-number {
    position: absolute;
    z-index: 6;
    bottom: 7px;
    right: 9px;
    font-size: 8px;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.45);
}

.gift.opened {
    transform: scale(0.94);
    opacity: 0.48;
    border-color: rgba(255, 172, 255, 0.22);
}

.gift.opened .ribbon-knot {
    box-shadow: none;
}

/* ---------- POPUP ---------- */

.hint-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
    background: rgba(10, 0, 15, 0.42);
    backdrop-filter: blur(5px);
    animation: fadeIn 0.25s ease;
    cursor: pointer;
}

.hint-card {
    width: min(420px, 90vw);
    min-height: 155px;
    padding: 38px 30px;
    border-radius: 17px;
    border: 1px solid rgba(255, 189, 255, 0.35);
    background:
        linear-gradient(
            145deg,
            rgba(83, 27, 93, 0.97),
            rgba(40, 10, 47, 0.98)
        );
    box-shadow:
        0 0 35px rgba(221, 69, 239, 0.25),
        inset 0 0 30px rgba(255, 130, 241, 0.06);
    text-align: center;
    cursor: default;
    animation: popupIn 0.3s ease;
}

.hint-card p {
    font-size: clamp(18px, 3vw, 24px);
    line-height: 1.4;
    color: #fff;
    text-shadow: 0 0 10px rgba(255,255,255,0.25);
}

.hint-card small {
    display: block;
    margin-top: 18px;
    font-size: 8px;
    letter-spacing: 3px;
    color: rgba(255,255,255,0.42);
    text-transform: uppercase;
}

@keyframes popupIn {
    from {
        opacity: 0;
        transform: scale(0.85) translateY(15px);
    }

    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

/* ---------- INVITATION ---------- */

.invitation-screen {
    animation: invitationIn 1.2s ease;
}

@keyframes invitationIn {
    from {
        opacity: 0;
        transform: scale(1.04);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

.invitation-card {
    width: min(500px, 92vw);
    padding: 45px 35px;
    border: 1px solid rgba(255, 193, 255, 0.42);
    border-radius: 18px;
    background:
        linear-gradient(
            145deg,
            rgba(91, 33, 99, 0.7),
            rgba(45, 12, 51, 0.82)
        );
    box-shadow:
        0 0 60px rgba(219, 68, 237, 0.17),
        inset 0 0 35px rgba(255, 145, 238, 0.05);
    text-align: center;
}

.invitation-label {
    font-size: 9px;
    letter-spacing: 6px;
    color: rgba(255,255,255,0.58);
    margin-bottom: 18px;
    text-transform: uppercase;
}

.invitation-title {
    font-size: clamp(47px, 7vw, 70px);
    line-height: 0.95;
    text-shadow:
        0 0 7px white,
        0 0 18px rgba(255, 150, 255, 0.75),
        0 0 35px rgba(239, 77, 255, 0.35);
    margin-bottom: 28px;
}

.date {
    font-size: 27px;
    font-weight: bold;
    letter-spacing: 1px;
    margin-bottom: 5px;
}

.time {
    font-size: 10px;
    letter-spacing: 5px;
    color: rgba(255,255,255,0.72);
    margin-bottom: 23px;
}

.divider {
    width: 55px;
    height: 1px;
    margin: 0 auto 24px;
    background: rgba(255, 190, 255, 0.55);
}

.invitation-lines {
    font-size: 15px;
    line-height: 1.75;
    font-weight: bold;
}

.sealed {
    margin-top: 20px;
    font-size: 8px;
    letter-spacing: 3px;
    color: rgba(255,255,255,0.46);
}

/* ---------- MOBILE ---------- */

@media (max-width: 700px) {

    .gift-page {
        padding-top: 45px;
    }

    .main-title {
        font-size: 44px;
    }

    .sub-title {
        font-size: 11px;
        margin-bottom: 24px;
    }

    .gift-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 9px;
        width: min(410px, 94vw);
    }

    .gift {
        border-radius: 9px;
    }

    .gift-number {
        font-size: 7px;
        bottom: 5px;
        right: 6px;
    }

    .invitation-card {
        padding: 38px 25px;
    }

    .invitation-title {
        font-size: 49px;
    }
}

@media (max-width: 390px) {

    .gift-grid {
        gap: 7px;
    }

    .gift-number {
        display: none;
    }

    .main-title {
        font-size: 39px;
    }
}
</style>
</head>

<body>

<div class="background-glow"></div>

<!-- Floating particles -->
<div class="particle" style="left:12%; animation-duration:11s; animation-delay:-2s;"></div>
<div class="particle" style="left:27%; animation-duration:14s; animation-delay:-7s;"></div>
<div class="particle" style="left:44%; animation-duration:12s; animation-delay:-4s;"></div>
<div class="particle" style="left:62%; animation-duration:15s; animation-delay:-9s;"></div>
<div class="particle" style="left:79%; animation-duration:10s; animation-delay:-5s;"></div>
<div class="particle" style="left:91%; animation-duration:13s; animation-delay:-1s;"></div>

<!-- =========================================================
     MUSIC
     File must be in the same GitHub repository as index.html
     ========================================================= -->

<audio id="birthdaySong" preload="auto">
    <source src="Hey Rangule - NaaSongsHD.mp3" type="audio/mpeg">
</audio>


<!-- =========================================================
     GIFT SCREEN
     ========================================================= -->

<section id="giftScreen" class="screen gift-page">

    <div class="top-label">
        Something is waiting
    </div>

    <h1 class="main-title">
        OPEN CAREFULLY.
    </h1>

    <p class="sub-title">
        Some things are better discovered.
    </p>

    <div id="giftGrid" class="gift-grid"></div>

</section>


<!-- =========================================================
     HINT POPUP
     ========================================================= -->

<div id="hintOverlay" class="hint-overlay hidden">

    <div id="hintCard" class="hint-card">

        <p id="hintText"></p>

        <small>
            some things are better discovered
        </small>

    </div>

</div>


<!-- =========================================================
     INVITATION SCREEN
     ========================================================= -->

<section id="invitationScreen" class="screen invitation-screen hidden">

    <div class="invitation-card">

        <div class="invitation-label">
            A little something
        </div>

        <h1 class="invitation-title">
            SAVE<br>
            THE DATE
        </h1>

        <div class="date">
            30 OCTOBER
        </div>

        <div class="time">
            10:00 AM
        </div>

        <div class="divider"></div>

        <div class="invitation-lines">
            ONE MORNING.<br>
            ONE PLAN.<br>
            ONE PLACE.
        </div>

        <div class="sealed">
            PRIVATE THEATRE · LOCATION SEALED
        </div>

    </div>

</section>


<script>

/* =========================================================
   24 SUSPENSE HINTS

   IMPORTANT:
   These DO NOT reveal the actual gifts.
   ========================================================= */

const hints = [

    "Something you'll understand the moment you see it. 👀",

    "A little change can make a familiar look feel completely different.",

    "For one of those days when you want everything to feel just right.",

    "Something small, but somehow always useful.",

    "A little detail that makes a big difference.",

    "This one belongs where you go. Not where you stay.",

    "For the days when the sun has plans of its own. ☀️",

    "Something you'll probably reach for more often than you think.",

    "A small thing that quietly completes the picture.",

    "For something you carry around every day.",

    "This one is closer to you than it looks.",

    "A little reminder worth keeping close.",

    "Something familiar… with a little more meaning.",

    "This one is meant to stay with you.",

    "For a corner that deserves a little light.",

    "A little care for the person wearing it.",

    "Another little bit of care. You'll know when.",

    "Sweetness was obviously necessary. 🍫",

    "Because one was never going to be enough.",

    "This one isn't meant to be kept in a box for long.",

    "Something that makes a celebration feel like a celebration.",

    "A little protection for the journey.",

    "For the journeys where you need a little extra comfort.",

    "The biggest surprise is the one you won't guess from here."
];


/* =========================================================
   CREATE THE 24 GIFT BOXES
   ========================================================= */

const giftGrid = document.getElementById("giftGrid");

hints.forEach((hint, index) => {

    const gift = document.createElement("div");

    gift.className = "gift";

    gift.innerHTML = `
        <div class="ribbon-knot"></div>
        <span class="gift-number">${String(index + 1).padStart(2, "0")}</span>
    `;

    gift.dataset.index = index;

    gift.addEventListener("click", () => {
        openGift(index, gift);
    });

    giftGrid.appendChild(gift);
});


/* =========================================================
   VARIABLES
   ========================================================= */

const audio = document.getElementById("birthdaySong");

const giftScreen = document.getElementById("giftScreen");

const invitationScreen =
    document.getElementById("invitationScreen");

const hintOverlay =
    document.getElementById("hintOverlay");

const hintText =
    document.getElementById("hintText");

let openedGifts = 0;
let musicStarted = false;
let currentGift = null;


/* =========================================================
   START MUSIC
   =========================================================

   Browser autoplay restrictions mean the music starts
   after the first gift is touched.

   It starts from EXACTLY 0 seconds.
   ========================================================= */

function startMusic() {

    if (musicStarted) return;

    musicStarted = true;

    audio.currentTime = 0;

    audio.play().catch(() => {
        /*
          If the browser blocks playback, the next user
          interaction will try again.
        */
        musicStarted = false;
    });
}


/* =========================================================
   OPEN GIFT
   ========================================================= */

function openGift(index, giftElement) {

    startMusic();

    /*
      Don't count the same gift twice.
    */
    if (giftElement.classList.contains("opened")) {
        showHint(index);
        return;
    }

    giftElement.classList.add("opened");

    openedGifts++;

    showHint(index);
}


/* =========================================================
   SHOW HINT
   ========================================================= */

function showHint(index) {

    currentGift = index;

    hintText.textContent = hints[index];

    hintOverlay.classList.remove("hidden");
}


/* =========================================================
   POPUP BEHAVIOUR
   =========================================================

   There is NO CLOSE button.

   Tapping outside the message closes it.
   ========================================================= */

hintOverlay.addEventListener("click", function(event) {

    if (event.target === hintOverlay) {

        closeHint();

    }

});


/*
   Also allow tapping the hint itself to continue.
   This keeps the experience simple on mobile.
*/

document.getElementById("hintCard").addEventListener("click", function() {

    closeHint();

});


function closeHint() {

    hintOverlay.classList.add("hidden");

    /*
      Once all 24 boxes have been opened,
      move directly to the invitation.
    */

    if (openedGifts >= 24) {

        setTimeout(() => {

            showInvitation();

        }, 450);

    }

}


/* =========================================================
   SHOW INVITATION
   ========================================================= */

function showInvitation() {

    /*
      STOP THE SONG IMMEDIATELY.
    */

    audio.pause();

    audio.currentTime = 0;

    giftScreen.classList.add("hidden");

    hintOverlay.classList.add("hidden");

    invitationScreen.classList.remove("hidden");

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================================================
   EXTRA SAFETY
   =========================================================

   If the song somehow reaches the end, don't restart it.
   ========================================================= */

audio.addEventListener("ended", () => {

    audio.pause();

});


/*
   If the first tap was blocked by the browser,
   try again on the next interaction.
*/

document.addEventListener("pointerdown", () => {

    if (!musicStarted) {

        audio.currentTime = 0;

        audio.play()
            .then(() => {
                musicStarted = true;
            })
            .catch(() => {});

    }

}, { once: false });


</script>

</body>
</html>
