<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finally... The Wait Is Over ❤️</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    #351044 0%,
                    #1d0826 45%,
                    #09030d 100%
                );

            color: white;

            font-family:
                Georgia,
                "Times New Roman",
                serif;
        }


        /* =========================================
           SCREEN
        ========================================= */

        .screen {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100dvh;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;

            padding: 20px;

            transition:
                opacity 0.9s ease,
                transform 0.9s ease;
        }


        .screen.hidden {
            opacity: 0;

            pointer-events: none;

            transform: scale(1.05);
        }


        /* =========================================
           BACKGROUND GLOW
        ========================================= */

        .background-glow {
            position: absolute;

            width: 45vw;
            height: 45vw;

            max-width: 600px;
            max-height: 600px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(210, 80, 255, 0.16),
                    transparent 70%
                );

            filter: blur(20px);

            pointer-events: none;
        }


        /* =========================================
           STARS
        ========================================= */

        .stars {
            position: absolute;

            inset: 0;

            pointer-events: none;
        }


        .star {
            position: absolute;

            width: 2px;
            height: 2px;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.7);

            animation:
                twinkle 3s ease-in-out infinite;
        }


        .star:nth-child(1) {
            left: 8%;
            top: 20%;
            animation-delay: 0s;
        }

        .star:nth-child(2) {
            left: 18%;
            top: 65%;
            animation-delay: 1s;
        }

        .star:nth-child(3) {
            left: 30%;
            top: 35%;
            animation-delay: 2s;
        }

        .star:nth-child(4) {
            left: 45%;
            top: 15%;
            animation-delay: 0.5s;
        }

        .star:nth-child(5) {
            left: 63%;
            top: 27%;
            animation-delay: 1.5s;
        }

        .star:nth-child(6) {
            left: 77%;
            top: 62%;
            animation-delay: 2.5s;
        }

        .star:nth-child(7) {
            left: 90%;
            top: 25%;
            animation-delay: 1s;
        }

        .star:nth-child(8) {
            left: 73%;
            top: 82%;
            animation-delay: 2s;
        }

        .star:nth-child(9) {
            left: 42%;
            top: 78%;
            animation-delay: 0.8s;
        }

        .star:nth-child(10) {
            left: 94%;
            top: 53%;
            animation-delay: 1.8s;
        }


        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.2;
                transform: scale(0.8);
            }

            50% {
                opacity: 1;
                transform: scale(1.5);
            }
        }


        /* =========================================
           CONTENT
        ========================================= */

        .content {
            position: relative;

            z-index: 5;

            width: min(900px, 100%);

            display: flex;

            flex-direction: column;

            align-items: center;

            text-align: center;
        }


        /* =========================================
           SMALL TITLE
        ========================================= */

        .eyebrow {
            font-size:
                clamp(12px, 1.2vw, 17px);

            letter-spacing:
                clamp(3px, 0.5vw, 6px);

            text-transform: uppercase;

            color:
                rgba(255, 255, 255, 0.62);

            margin-bottom:
                clamp(12px, 2vh, 22px);

            opacity: 0;

            animation:
                fadeUp 1s ease forwards;

            animation-delay: 0.3s;
        }


        /* =========================================
           MAIN TITLE
        ========================================= */

        h1 {
            font-size:
                clamp(40px, 6.4vw, 86px);

            line-height: 0.95;

            font-weight: 500;

            letter-spacing:
                clamp(1px, 0.2vw, 4px);

            text-transform: uppercase;

            margin-bottom:
                clamp(16px, 2.5vh, 25px);

            text-shadow:
                0 0 15px rgba(255, 150, 220, 0.25),
                0 0 45px rgba(220, 90, 255, 0.15);

            opacity: 0;

            animation:
                titleReveal 1.3s ease forwards;

            animation-delay: 0.8s;
        }


        /* =========================================
           DESCRIPTION
        ========================================= */

        .description {
            width: min(620px, 100%);

            font-size:
                clamp(15px, 1.5vw, 20px);

            line-height: 1.55;

            color:
                rgba(255, 255, 255, 0.72);

            margin-bottom:
                clamp(16px, 2.5vh, 25px);

            opacity: 0;

            animation:
                fadeUp 1s ease forwards;

            animation-delay: 1.8s;
        }


        /* =========================================
           QUESTION
        ========================================= */

        .question {
            font-size:
                clamp(18px, 2.1vw, 28px);

            line-height: 1.35;

            color: white;

            max-width: 650px;

            margin-bottom:
                clamp(18px, 2.5vh, 28px);

            text-shadow:
                0 0 18px rgba(255, 100, 200, 0.3);

            opacity: 0;

            animation:
                fadeUp 1s ease forwards;

            animation-delay: 2.5s;
        }


        /* =========================================
           BUTTON
        ========================================= */

        .ready-button {

            /*
             * IMPORTANT:
             * fixed = button position is based
             * on the entire browser screen.
             */

            position: fixed;

            left: 50%;
            top: 78%;

            transform:
                translate(-50%, -50%);

            min-width: 175px;

            padding:
                15px 35px;

            border-radius: 50px;

            border:
                1px solid rgba(255, 255, 255, 0.4);

            background:
                linear-gradient(
                    135deg,
                    #e15aaa,
                    #ad4be4
                );

            color: white;

            font-family: inherit;

            font-size: 16px;

            letter-spacing: 1.5px;

            cursor: pointer;

            z-index: 100;

            box-shadow:
                0 8px 30px rgba(230, 70, 180, 0.35);

            transition:
                left 0.42s cubic-bezier(0.2, 1.3, 0.4, 1),
                top 0.42s cubic-bezier(0.2, 1.3, 0.4, 1),
                transform 0.15s ease,
                box-shadow 0.25s ease;
        }


        .ready-button:hover {

            box-shadow:
                0 12px 45px rgba(230, 70, 180, 0.6);
        }


        .ready-button:active {

            transform:
                translate(-50%, -50%)
                scale(0.94);
        }


        /* =========================================
           SCREEN 2
        ========================================= */

        .screen-two-content {

            max-width: 750px;
        }


        .screen-two-content h2 {

            font-size:
                clamp(38px, 6vw, 75px);

            line-height: 1;

            font-weight: 500;

            margin-bottom: 25px;
        }


        .screen-two-content p {

            font-size:
                clamp(16px, 2vw, 22px);

            line-height: 1.7;

            color:
                rgba(255, 255, 255, 0.72);
        }


        /* =========================================
           ANIMATIONS
        ========================================= */

        @keyframes fadeUp {

            from {
                opacity: 0;

                transform:
                    translateY(22px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        @keyframes titleReveal {

            from {
                opacity: 0;

                transform:
                    scale(0.9);

                filter:
                    blur(10px);
            }

            to {
                opacity: 1;

                transform:
                    scale(1);

                filter:
                    blur(0);
            }
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .screen {

                padding: 18px;
            }


            .description {

                max-width: 340px;
            }


            .question {

                max-width: 340px;
            }


            .ready-button {

                min-width: 160px;

                padding:
                    14px 28px;

                font-size: 14px;
            }
        }


        /* =========================================
           SHORT SCREEN
        ========================================= */

        @media (max-height: 700px) {

            .eyebrow {

                margin-bottom: 8px;
            }


            h1 {

                margin-bottom: 12px;
            }


            .description {

                margin-bottom: 12px;
            }


            .question {

                margin-bottom: 12px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================================
         SCREEN 1
    ========================================= -->

    <section
        class="screen"
        id="screen1"
    >

        <div class="background-glow"></div>


        <div class="stars">

            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>

        </div>


        <div class="content">


            <div class="eyebrow">

                30 Days • 30 Wishes

            </div>


            <h1>

                Finally...

                <br>

                The Wait Is Over.

            </h1>


            <p class="description">

                Thirty days of wishes brought us all the way here...
                and now there's only one thing left to ask.

            </p>


            <p class="question">

                Are you ready to see

                <br>

                what surprise I planned for you? 👀❤️

            </p>


        </div>


        <!-- =====================================
             RUNAWAY BUTTON
        ===================================== -->

        <button
            id="readyButton"
            class="ready-button"
            type="button"
        >

            I'M READY ✨

        </button>


    </section>



    <!-- =========================================
         SCREEN 2
    ========================================= -->

    <section
        class="screen hidden"
        id="screen2"
    >

        <div
            class="content screen-two-content"
        >

            <h2>

                Oh...

                <br>

                You Actually Made It. 👀

            </h2>


            <p>

                And this is only the beginning...

            </p>

        </div>

    </section>



    <!-- =========================================
         JAVASCRIPT
    ========================================= -->

    <script>


        /* =========================================
           ELEMENTS
        ========================================= */

        const button =
            document.getElementById(
                "readyButton"
            );


        const screen1 =
            document.getElementById(
                "screen1"
            );


        const screen2 =
            document.getElementById(
                "screen2"
            );



        /* =========================================
           RUNAWAY SETTINGS
        ========================================= */


        /*
         * Distance from cursor to button
         * before the button runs away.
         *
         * Increase this if you want it
         * to escape earlier.
         */

        const detectionDistance = 180;


        /*
         * How far the button runs.
         */

        const escapeDistance = 230;


        /*
         * Prevent multiple movements
         * during the same animation.
         */

        let moving = false;



        /* =========================================
           POINTER POSITION
        ========================================= */

        let pointerX = null;

        let pointerY = null;



        /* =========================================
           GET BUTTON CENTER
        ========================================= */

        function getButtonPosition() {

            const rect =
                button.getBoundingClientRect();


            return {

                x:
                    rect.left +
                    rect.width / 2,

                y:
                    rect.top +
                    rect.height / 2,

                width:
                    rect.width,

                height:
                    rect.height

            };

        }



        /* =========================================
           CHECK DISTANCE
        ========================================= */

        function checkDistance() {


            if (
                pointerX === null ||
                pointerY === null ||
                moving
            ) {

                return;

            }


            const buttonPosition =
                getButtonPosition();


            const dx =
                buttonPosition.x -
                pointerX;


            const dy =
                buttonPosition.y -
                pointerY;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            /*
             * CURSOR IS CLOSE.
             *
             * RUN!
             */

            if (
                distance <
                detectionDistance
            ) {

                moveButtonAway();

            }

        }



        /* =========================================
           MOVE BUTTON AWAY
        ========================================= */

        function moveButtonAway() {


            moving = true;


            const buttonPosition =
                getButtonPosition();


            /*
             * Direction AWAY
             * from cursor.
             */

            let dx =
                buttonPosition.x -
                pointerX;


            let dy =
                buttonPosition.y -
                pointerY;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            /*
             * Normalize direction.
             */

            if (
                distance < 1
            ) {

                dx = 0;

                dy = -1;

            }

            else {

                dx /=
                    distance;

                dy /=
                    distance;

            }


            /*
             * Add random angle.
             *
             * This prevents the button
             * from always escaping in
             * exactly the same direction.
             */

            const angle =
                (Math.random() - 0.5) *
                0.8;


            const cos =
                Math.cos(angle);


            const sin =
                Math.sin(angle);


            const finalDX =
                dx * cos -
                dy * sin;


            const finalDY =
                dx * sin +
                dy * cos;



            /* =====================================
               NEW POSITION
            ===================================== */

            let newX =
                buttonPosition.x +
                finalDX *
                escapeDistance;


            let newY =
                buttonPosition.y +
                finalDY *
                escapeDistance;



            /* =====================================
               KEEP BUTTON ON SCREEN
            ===================================== */

            const margin = 40;


            const halfWidth =
                buttonPosition.width /
                2;


            const halfHeight =
                buttonPosition.height /
                2;


            newX =
                Math.max(
                    halfWidth + margin,

                    Math.min(
                        window.innerWidth -
                        halfWidth -
                        margin,

                        newX
                    )
                );


            newY =
                Math.max(
                    halfHeight + margin,

                    Math.min(
                        window.innerHeight -
                        halfHeight -
                        margin,

                        newY
                    )
                );



            /* =====================================
               MOVE
            ===================================== */

            button.style.left =
                newX + "px";


            button.style.top =
                newY + "px";



            /* =====================================
               READY TO ESCAPE AGAIN
            ===================================== */

            setTimeout(
                function() {

                    moving = false;


                    /*
                     * If cursor is STILL close
                     * to the new button position,
                     * run again.
                     */

                    checkDistance();

                },

                420
            );

        }



        /* =========================================
           MOUSE
        ========================================= */

        document.addEventListener(
            "mousemove",

            function(event) {


                pointerX =
                    event.clientX;


                pointerY =
                    event.clientY;


                checkDistance();

            }
        );



        /* =========================================
           TOUCH START
        ========================================= */

        document.addEventListener(
            "touchstart",

            function(event) {


                if (
                    !event.touches ||
                    event.touches.length === 0
                ) {

                    return;

                }


                pointerX =
                    event.touches[0].clientX;


                pointerY =
                    event.touches[0].clientY;


                checkDistance();

            },

            {
                passive: true
            }
        );



        /* =========================================
           TOUCH MOVE
        ========================================= */

        document.addEventListener(
            "touchmove",

            function(event) {


                if (
                    !event.touches ||
                    event.touches.length === 0
                ) {

                    return;

                }


                pointerX =
                    event.touches[0].clientX;


                pointerY =
                    event.touches[0].clientY;


                checkDistance();

            },

            {
                passive: true
            }
        );



        /* =========================================
           BUTTON CLICK
        ========================================= */

        button.addEventListener(
            "click",

            function(event) {


                event.preventDefault();


                /*
                 * She finally caught it.
                 *
                 * Bring button to center.
                 */

                button.style.left =
                    "50vw";


                button.style.top =
                    "50vh";


                /*
                 * Then open Screen 2.
                 */

                setTimeout(
                    function() {


                        screen1.classList.add(
                            "hidden"
                        );


                        screen2.classList.remove(
                            "hidden"
                        );


                    },

                    700
                );

            }
        );



        /* =========================================
           INITIAL POSITION
        ========================================= */

        window.addEventListener(
            "load",

            function() {


                /*
                 * Button starts at lower
                 * center of screen.
                 */

                button.style.left =
                    "50vw";


                button.style.top =
                    "78vh";

            }
        );



        /* =========================================
           SCREEN RESIZE
        ========================================= */

        window.addEventListener(
            "resize",

            function() {


                const rect =
                    button.getBoundingClientRect();


                const margin = 35;


                let x =
                    rect.left +
                    rect.width / 2;


                let y =
                    rect.top +
                    rect.height / 2;


                const halfWidth =
                    rect.width / 2;


                const halfHeight =
                    rect.height / 2;


                x =
                    Math.max(
                        halfWidth + margin,

                        Math.min(
                            window.innerWidth -
                            halfWidth -
                            margin,

                            x
                        )
                    );


                y =
                    Math.max(
                        halfHeight + margin,

                        Math.min(
                            window.innerHeight -
                            halfHeight -
                            margin,

                            y
                        )
                    );


                button.style.left =
                    x + "px";


                button.style.top =
                    y + "px";

            }
        );


    </script>


</body>
</html>
